name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  # 週次のキャッシュ温め (キャッシュ健全性の保険)。main push の温めビルドは
  # paths ゲート (#919) のスキップや連続 push の concurrency キャンセルで
  # 長期間完走しないことがあり、GitHub Actions のキャッシュは 7 日間未アクセスで
  # 削除されるため、main スコープの rust-cache (DuckDB #709 の bundled ビルド
  # 成果物を含む) が失効した状態でタグビルドが毎回コールドスタートしていた
  # (v0.9.0〜v0.9.2 のリリースビルドが 27〜35 分に悪化した主因)。週 1 回の
  # 定期実行で main スコープのキャッシュを常に新鮮に保ち、タグビルドが確実に
  # フォールバック復元できるようにする。
  schedule:
    - cron: "0 3 * * 1" # 毎週月曜 03:00 UTC

# main への push が連続したとき、古い「キャッシュ温め」ビルドを取り消して
# CI 時間を節約する。タグ (リリース) ビルドは ref ごとにグループが分かれる上
# cancel-in-progress も false なので、取り消されることはない。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

# corepack が pnpm を取得する際の対話プロンプトを無効化 (CI は非対話)。
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  # 変更されたパスを見て、キャッシュ温めビルド (build ジョブ) を出し分ける
  # (#919)。ci.yml の changes ジョブと同型だが、対象はタグ以外の main push
  # (= キャッシュ温め目的のビルド) のみ。タグ push は比較対象コミットが無く
  # paths-filter が意味を持たないため、このジョブ自体をタグでは実行しない
  # (build 側の if でタグを無条件許可してゲートを迂回する)。workflow_dispatch
  # (手動実行) も同様にゲート対象外とし、常に実ビルドが走るようにする。
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      # push イベントはローカルの git 履歴比較を行うため checkout が必要
      # (ci.yml の changes ジョブと同じ配慮)。直前コミットとの差分比較なので
      # 親コミットまで含む fetch-depth: 2 で paths-filter が自前 fetch に
      # フォールバックせず確実に履歴比較できるようにする。
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              # vite.config.ts で publicDir を無効化していないため、public/ 配下
              # (brand-icon.svg 等) はそのままビルド成果物に入る。ここに入れないと
              # public/ だけを変えた main push でキャッシュ温めビルドが skip される。
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'vite.config.ts'
              - 'vitest.browser.config.ts'
            rust:
              - 'src-tauri/**'

  build:
    name: build (${{ matrix.platform }})
    needs: changes
    # ゲート対象は「タグ以外の main push (= キャッシュ温めビルド)」のみ。
    # タグ push (リリースビルド)・workflow_dispatch (手動実行)・schedule
    # (週次のキャッシュ温め。キャッシュを新鮮に保つこと自体が目的なので変更
    # 有無に関わらず実行する) は changes ジョブの結果に関わらず常にこの
    # ジョブを実行する。これらのイベントでは changes ジョブ自体を上の if で
    # skip しているため、素の needs 既定 (success() 相当) だと build も連鎖
    # して skip されてしまう — それを always() で止め、実際の実行可否は
    # 下記の OR 条件で判定する。
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/v') ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule' ||
       needs.changes.outputs.rust == 'true' ||
       needs.changes.outputs.frontend == 'true')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    # ハング時にデフォルト 6 時間ランナーを占有し続けるのを防ぐ (正常時は影響なし)。
    timeout-minutes: 90
    steps:
      # このジョブは push を行わないため、認証情報をローカル git 設定に残さない
      # (tauri-action は env の GITHUB_TOKEN を明示的に受け取る)。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Get pnpm store directory
        shell: bash
        run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: "./src-tauri -> target"
          # タグビルドではキャッシュを保存しない (復元のみ)。GitHub Actions の
          # キャッシュはタグ ref スコープに保存されると main や他のタグの実行
          # から参照できず、同じタグが再実行されることも無いため、タグビルド
          # 末尾の Post Cache (~1 分) が純粋な無駄になる。main (温めビルド) と
          # schedule / workflow_dispatch では従来どおり保存する。
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Cache Tauri bundler tools (NSIS / WiX)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\tauri\NSIS
            ~\AppData\Local\tauri\WixTools
          key: tauri-bundler-${{ runner.os }}-v1

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Sync version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_REF#v}"
          echo "Syncing project version to ${VERSION}"
          VERSION="${VERSION}" node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            let toml = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            toml = toml.replace(/^version = "[^"]*"/m, "version = \"" + v + "\"");
            fs.writeFileSync("src-tauri/Cargo.toml", toml);
            let lock = fs.readFileSync("src-tauri/Cargo.lock", "utf8");
            lock = lock.replace(/(name = "noobdb"\nversion = ")[^"]*"/, "$1" + v + "\"");
            fs.writeFileSync("src-tauri/Cargo.lock", lock);
          '

      # タグ以外 (main への push / 手動実行) では、リリースを作らずに
      # ビルドだけ走らせて rust-cache (target) を main スコープに温める。
      # タグビルドはここで作られた main スコープのキャッシュにフォールバックして
      # ヒットするようになる。
      #
      # updater アーティファクト生成 (createUpdaterArtifacts、#705) は署名鍵
      # (TAURI_SIGNING_PRIVATE_KEY) を要求し、鍵が無いとビルドが失敗する。キャッシュ
      # 温めビルドには鍵を渡さない (Secrets はリリース時のみ) ため、--config で
      # createUpdaterArtifacts を false に上書きして通常の NSIS ビルドだけ行う。
      - name: Build Tauri app (cache warm, no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}' -- ${{ matrix.args }}

      # タグ push のときだけ実際のリリースへ成果物をアップロードする。
      #
      # releaseDraft は false にすること。tauri-action はこのフラグと「同じ状態」の
      # リリースしかタグ名で探さない: true だと未公開ドラフトのみを探すため、
      # GitHub UI で先にリリースを公開してタグを生成する運用 (本リポジトリの通常
      # フロー) では既存リリースを見つけられず、成果物 (インストーラ + .sig +
      # latest.json) が誰にも見えない別ドラフト「noobDB vX.Y.Z」へ迷子になる
      # (v0.8.2 で実際に発生)。false なら公開済みリリースを getReleaseByTag で
      # 見つけてそこへ添付し、リリースが無い場合 (タグだけを git push した場合) は
      # 公開リリースを新規作成する (本文は空になるのでリリースノートは後から編集)。
      #
      # updater 用の latest.json + 署名は tauri-action が createUpdaterArtifacts を
      # 検出して自動生成・アップロードする (#705)。latest.json は
      # releases/latest/download/ 経由で参照されるため、成果物が公開リリースに
      # 載らないとアプリ内更新も機能しない。署名鍵は GitHub Actions Secrets で
      # 管理し、リポジトリには置かない (公開鍵のみ tauri.conf.json の
      # plugins.updater.pubkey)。Secrets 未設定のリポジトリではこの署名付きビルドが
      # 失敗するため、更新機能を使うには TAURI_SIGNING_PRIVATE_KEY (と鍵にパスワードを
      # 付けた場合は TAURI_SIGNING_PRIVATE_KEY_PASSWORD) の登録が前提。
      - name: Build Tauri app (release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "noobDB ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # 出荷バイナリ (インストーラ / 実行ファイル) のサイズを Job Summary に可視化する
      # (#549)。バンドルサイズ可視化 (#443) のアプリ本体版で、方針も同じ:
      # 当面は閾値で fail させず可視化のみ、追加ツールは増やさずシェル標準機能だけで
      # 集計する。cache-warm ビルド (pnpm tauri build) でもリリースビルド
      # (tauri-action) でも成果物は同じ target/release/bundle 配下に出るため、両経路の
      # 後に always() で 1 回測る。macOS/Linux バンドル追加後 (本 Epic の別 Issue) は
      # .dmg / .AppImage / .deb のグロブが自動的に対象に含まれる。起動時間の監視は
      # 計測の安定性が難しいため本 Issue のスコープ外 (任意/将来拡張) とする。
      - name: Report bundle artifact sizes
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          summary="${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          files=(
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          )
          {
            echo "### 出荷バイナリサイズ (${{ matrix.platform }})"
            echo ""
            echo "| 成果物 | サイズ |"
            echo "| --- | ---: |"
          } >> "$summary"
          if [ ${#files[@]} -eq 0 ]; then
            echo "| (成果物が見つかりませんでした) | — |" >> "$summary"
          else
            for f in "${files[@]}"; do
              bytes=$(stat -c %s "$f" 2>/dev/null || stat -f %z "$f" 2>/dev/null || echo 0)
              human=$(awk -v b="$bytes" 'BEGIN { printf "%.2f MiB", b/1048576 }')
              printf '| `%s` | %s |\n' "$(basename "$f")" "$human" >> "$summary"
            done
          fi
