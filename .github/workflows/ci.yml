name: ci

# pull_request に加えて main への push でも起動する。pull_request 実行で保存される
# キャッシュ (rust-cache / sccache / pnpm) は PR のマージ ref スコープにしか残らず
# 他の PR からは参照できないため、main push 時に同じジョブを走らせてキャッシュを
# main スコープへ保存する (全 PR ブランチがフォールバックで復元できる唯一のスコープ)。
# これが無いと新規 PR ブランチの初回 Rust ビルドは毎回コールドになる。マージ後の
# main の健全性確認 (post-merge check) も兼ねる。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# corepack が pnpm を取得する際の対話プロンプトを無効化 (CI は非対話)。
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  # 変更されたパスを見て後続ジョブを出し分ける。ワークフロー単位の paths で
  # 丸ごとスキップすると必須チェックが「待機中」のまま固まるため、ここでは
  # ジョブ単位の if: でゲートする (スキップは必須チェックを満たす)。
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    # 各ジョブに timeout-minutes を付け、ハング時にデフォルト 6 時間ランナーを
    # 占有し続けるのを防ぐ (実測に余裕を持たせた保守的な上限。正常時は影響なし)。
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      workflow: ${{ steps.filter.outputs.workflow }}
      crosslang: ${{ steps.filter.outputs.crosslang }}
    steps:
      # pull_request イベントでは paths-filter は API 比較で checkout 不要だが、
      # push (main) イベントではローカルの git 履歴を比較するため checkout が必要。
      # push 比較は直前コミットとの差分なので、親コミットまで含む fetch-depth: 2 で
      # paths-filter が自前 fetch にフォールバックせず確実に履歴比較できるようにする。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            workflow:
              - '.github/workflows/ci.yml'
            frontend:
              - 'src/**'
              - 'index.html'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'vite.config.ts'
              - 'vitest.browser.config.ts'
            rust:
              - 'src-tauri/**'
            # #853: 言語横断のゴールデン/パリティテスト (Rust 側の
            # serde_schema_parity.rs / read_only_golden.rs / error_kind_golden.rs /
            # error_hint_golden.rs) が include_str! で読む共有フィクスチャだけが
            # 変わった PR は frontend==true だが rust==false になるため、
            # `rust (test)` ジョブの if: にこの crosslang を OR で足して確実に
            # 実走させる (詳細は下の `crosslang parity` ジョブのコメント参照)。
            crosslang:
              - 'src/__tests__/fixtures/**'

  # フロントエンドの typecheck/build/lint/単体テストと、実ブラウザでの描画/
  # ビジュアル回帰テストを 1 ジョブに統合している (#908)。旧来は `frontend` と
  # `frontend-visual` の 2 ジョブに分かれていたが、両ジョブが独立して
  # `pnpm install --frozen-lockfile` を実行し、Vite の依存プリバンドル (esbuild)
  # によるソース変換もそれぞれ別個に行っていたため、フロント資産の重複処理
  # (pnpm install ×2・トランスパイル ×2) が発生していた (Rust ジョブ側の同型の
  # 重複を解消した #796 の横展開)。
  #
  # #796 は「Rust の単体/統合テストは実フロント資産を必要としない
  # (dist/index.html のスタブで足りる)」性質を利用して重複ビルドそのものを
  # 消したが、本ジョブ (旧 frontend-visual) は実際にコンポーネントをレンダリング
  # するため dist/ のスタブ化は使えない。加えて `pnpm run build` (本番ビルド、
  # tsc + Rollup) と `pnpm test:browser` (Vitest ブラウザモード、Vite dev サーバの
  # 依存プリバンドルキャッシュ `node_modules/.vite` を使う) はそもそも別パイプラインで
  # 成果物 (dist/) を共有できないため、dist/ をジョブ間で受け渡す方式では重複を
  # 解消できない。そのため「1 ジョブに統合し、pnpm install とセットアップを 1 回に
  # 集約する」方式を採用した (#796 の「不要な作業自体を無くす」方針を、こちらでは
  # 「両ジョブが必要とする作業を 1 回にまとめる」形で踏襲している)。
  #
  # トレードオフ (要検討事項): 旧 `frontend` / `frontend-visual` は並列実行だった
  # ため壁時計は max(typecheck+build 系, ブラウザテスト系) だったが、統合後は
  # 直列実行の合計になる。実測ではいずれも Rust 側ジョブ (特に `rust (test)` の
  # MySQL/PostgreSQL 統合テスト + カバレッジ計装) がワークフロー全体の
  # クリティカルパスであり、フロント側を直列化しても全体の壁時計時間への影響は
  # 小さいと判断した。一方でブラウザテスト側の「install/トランスパイル部」
  # (pnpm install の再実行・Vite 依存プリバンドルのコールドスタート) は統合により
  # 実行そのものが 1 回に減り (同一ジョブ内で node_modules・ファイルシステム
  # キャッシュが確実に温まった状態から始まる)、加えて Playwright の Chromium
  # バイナリも actions/cache で永続化したため、キャッシュヒット時は再ダウンロード
  # も避けられる。
  #
  # 必須チェック名への影響: 旧来の `frontend (typecheck + build)` と
  # `frontend (browser render + visual)` の 2 つのチェック名は本統合で消え、
  # 単一の `frontend (build + browser tests)` に置き換わる。GitHub のブランチ
  # 保護で必須チェックにこれらの旧名を指定していた場合は、新しいジョブ名へ
  # 設定し直す必要がある (ブランチ保護設定はリポジトリのコードで管理していない
  # ため、本 PR のマージ後に GitHub 側の設定を手動更新する)。
  frontend:
    name: frontend (build + browser tests)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ジョブ全体の所要時間可視化 (#565) の起点。checkout より前に置き、
      # セットアップ込みの壁時計時間を測る。閾値 fail は設けない (可視化のみ)。
      - name: Record job start time (#565)
        run: echo "NOOBDB_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Get pnpm store directory
        shell: bash
        run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        id: pnpm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Vite の依存プリバンドルキャッシュ (`node_modules/.vite`)。`pnpm run build`
      # (Rollup 本番ビルド) はこのディレクトリを使わないため typecheck/build 側の
      # 高速化には寄与しないが、後段の `pnpm test:browser` (Vitest ブラウザモード
      # = Vite dev サーバ) の esbuild 依存プリバンドルはこのキャッシュを再利用
      # できる。pnpm install の直後 (node_modules 確立後) に配置し、pnpm store
      # キャッシュと同じくブランチ跨ぎ (main push によるキャッシュ温め含む) で有効。
      - name: Cache Vite dependency pre-bundle
        id: vite-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite
          key: ${{ runner.os }}-vite-deps-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts', 'vitest.browser.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-vite-deps-

      - name: Type-check and build
        run: pnpm run build

      # ビルド成果物 (dist/) の JS/CSS サイズを計測して Job Summary に出力する
      # (#443)。カバレッジ可視化と同じく当面は閾値による fail を設けず可視化のみ。
      # チャート可視化などライブラリ追加に伴うバンドル肥大化を PR で早期に検知する。
      - name: Bundle size report
        run: pnpm run bundle-size

      # 未使用エクスポート / 到達不能コード / 未使用依存を検出し、モジュール跨ぎの
      # デッドコード (tsc の noUnusedLocals では拾えない) と IPC ラッパ ⇔ UI 利用の
      # ドリフトを防ぐ (#470)。ベースラインは knip.json で green。新規の未使用
      # エクスポートが入ると fail する。
      - name: Dead-code / unused-export check (knip)
        run: pnpm run knip

      # カバレッジ計測込みで実行し、`vite.config.ts` の coverage.thresholds を
      # 下回ったらここで fail させる (品質ゲート / #290)。
      - name: Unit tests (Vitest) + coverage threshold
        run: pnpm test --coverage

      # Playwright の Chromium バイナリ本体をキャッシュする。`--with-deps` が
      # 導入する OS 側の共有ライブラリ (apt) はキャッシュ対象外 (ランナー単位の
      # システム状態のため actions/cache に馴染まない) だが、バイナリ本体
      # (数十〜100MB超) の再ダウンロードはこれで避けられる。キーは pnpm-lock.yaml
      # のハッシュに追従させ、Playwright の更新時は自動的に新しいキャッシュキーへ
      # 切り替わる。
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # Playwright の Chromium とシステム依存を導入する。--only-shell で headless
      # 実行に必要な chromium-headless-shell のみを入れて軽量化する。バイナリ本体は
      # 上の Cache Playwright browsers でキャッシュヒットしていれば再ダウンロードを
      # スキップする。
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # 実ブラウザ (Vitest ブラウザモード / Playwright + headless Chromium) で
      # 主要画面のレンダリングとビジュアル回帰を検証する (#306)。上の jsdom 単体
      # テストとは実行環境が異なるが、node_modules・Vite/Playwright のキャッシュは
      # このジョブの前段で既に温まっているため、旧 frontend-visual ジョブが個別に
      # 行っていた pnpm install / セットアップの再実行は不要になった (#908)。
      # Chakra UI 全面移行 (#271) のレイアウト/テーマ追従の退行を実 CSS で捕まえる
      # 受け皿。
      #
      # ビジュアル回帰のベースライン PNG は CI と同一環境 (この ubuntu-latest /
      # Chromium) で生成・コミットする運用 (.github/workflows/visual-baseline.yml の
      # workflow_dispatch で更新)。ローカル (macOS/Windows) の描画差による false
      # positive を避けるため、ベースライン生成は常にこの環境で行う。
      #
      # 主要画面のレンダリングスモーク (screens.browser.test.tsx) を実行する。
      # ビジュアル回帰 (visual.browser.test.tsx) は VITE_RUN_VISUAL=1 のときだけ走る
      # ため、ここでは既定でスキップされる (ベースライン PNG が無い環境では
      # toMatchScreenshot が失敗するため)。ベースラインを visual-baseline.yml の
      # workflow_dispatch で生成・コミットしたら、この step に
      # `env: VITE_RUN_VISUAL: "1"` を足してビジュアル回帰も必須化できる。
      - name: Browser render smoke (Vitest)
        run: pnpm test:browser

      # ジョブ所要時間とキャッシュヒット有無を Job Summary へ出力する (#565)。
      # バンドルサイズ (#443) / カバレッジ (#482) と同じく可視化のみで fail
      # させない。ビルド時間退行 (キャッシュミス・依存増) の早期発見が目的。
      - name: Job timing & cache summary (#565)
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - NOOBDB_JOB_START ))
          {
            echo "### frontend (build + browser tests) 所要時間・キャッシュ"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| 所要時間 | ${ELAPSED} 秒 |"
            echo "| pnpm store キャッシュヒット | ${{ steps.pnpm-cache.outputs.cache-hit }} |"
            echo "| Vite 依存プリバンドルキャッシュヒット | ${{ steps.vite-cache.outputs.cache-hit }} |"
            echo "| Playwright ブラウザキャッシュヒット | ${{ steps.playwright-cache.outputs.cache-hit }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
  # 言語横断のパリティ/ゴールデンテスト専用の軽量ジョブ (#853)。
  #
  # 背景: `ipcCommandParity.test.ts` / `ipcArgParity.test.ts` /
  # `streamEventParity.test.ts` は `?raw` インポートで src-tauri 側のソース
  # (`lib.rs` / `commands/*.rs` / `tasks/scheduler.rs`) を読み、`readOnlyGolden.test.ts` /
  # `errorKindGolden.test.ts` / `errorHintGolden.test.ts` / `schemaParity.test.ts` /
  # `exportFormatGolden.test.ts` (#879) は
  # Rust の統合テスト (`read_only_golden.rs` 等) と共有するフィクスチャ
  # (`src/__tests__/fixtures/*.json`) を検証する。`apiReachabilityParity.test.ts`
  # (#907) は Rust ソースこそ読まないが、UI 未到達ラッパーの削除は
  # `ipcCommandParity` (= Rust 側登録) と連動して直す必要があるため、同じ
  # 起動条件でここに同居させる。いずれも「相手言語の変更を捕まえる」
  # のが目的だが、従来は Vitest 一式として `frontend` ジョブにのみ含まれていたため
  # `src-tauri/**` のみを変更する PR では `frontend==false` となり、まさにその変更を
  # 検証すべきパリティテストが 1 本も走らなかった。
  #
  # 対応方針 (Issue #853 の (a) を採用): このジョブを新設し、対象の Vitest ファイル
  # だけをピンポイントで実行する。起動条件は `frontend==true || rust==true` の OR
  # (Issue が推奨する方式そのまま) — 両言語のどちらの変更でも確実に起動する。
  # 「frontend ジョブとテストが重複するのでは」という点は許容する: frontend
  # ジョブは `frontend==true` のときしか走らないためパリティ観点では不十分であり、
  # 逆に crosslang ジョブは対象ファイルのみで数秒 (`pnpm vitest run` 実測) と
  # 極めて軽量なため、重複コストよりカバレッジの穴を塞ぐ価値を優先する。
  #
  # 逆方向 (Rust 側のゴールデンテストがフロントのフィクスチャ変更を見逃す問題) は
  # このジョブだけでは塞げない — `serde_schema_parity.rs` / `read_only_golden.rs` /
  # `error_kind_golden.rs` / `error_hint_golden.rs` / `export_format_golden.rs` は
  # `rust (test)` ジョブの中で実行されるため、`src/__tests__/fixtures/**` だけを変更する PR
  # (`rust==false`) では引き続きスキップされてしまう。これは上の `changes` ジョブに
  # 追加した `crosslang` フィルタ (フィクスチャパス限定) を `rust (test)` の if: へ
  # OR で足すことで塞ぐ (そちらのコメント参照)。
  crosslang-parity:
    name: crosslang parity
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Get pnpm store directory
        shell: bash
        run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 言語横断のパリティ/ゴールデンテストのみをピンポイントで実行する。
      # 型チェック・ビルド・knip・カバレッジは `frontend` ジョブの専管なので
      # ここでは行わない (このジョブの役割は起動条件の穴埋めのみ)。
      - name: Cross-language parity/golden tests (Vitest)
        run: >-
          pnpm vitest run
          src/__tests__/ipcCommandParity.test.ts
          src/__tests__/ipcArgParity.test.ts
          src/__tests__/streamEventParity.test.ts
          src/__tests__/readOnlyGolden.test.ts
          src/__tests__/errorKindGolden.test.ts
          src/__tests__/errorHintGolden.test.ts
          src/__tests__/schemaParity.test.ts
          src/__tests__/exportFormatGolden.test.ts
          src/__tests__/apiReachabilityParity.test.ts

  rust-fmt:
    name: rust (fmt)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

  # clippy と nextest は別ジョブに分割して並列実行する。clippy は cargo check
  # 相当 (メタデータ emit のみ)、nextest は実バイナリ生成 (codegen + link) で、
  # cargo はこの 2 モードの成果物を共有しない。同一ジョブで直列に走らせると依存
  # ツリーが実質二重コンパイルされて積み上がるため、並列ジョブにして壁時計時間を
  # max(clippy, test) に縮める。各ジョブは rust-cache のキーが分かれるので
  # キャッシュは互いに干渉しない。CI では incremental コンパイルは無益で
  # オーバーヘッド・キャッシュ肥大を招くだけなので CARGO_INCREMENTAL=0 にする。
  rust-clippy:
    name: rust (clippy)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      # sccache をコンパイルキャッシュとして使う (#417)。rust-cache が target
      # ディレクトリをキャッシュするのに対し、sccache はコンパイル単位 (rustc 呼び
      # 出し) をキャッシュし、Cargo.lock 変更やキャッシュミス時のクリーンビルドを
      # 高速化する。SCCACHE_DIR を actions/cache で永続化してブランチ跨ぎで再利用する。
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      # ジョブ全体の所要時間可視化 (#565) の起点。checkout より前に置き、
      # セットアップ込みの壁時計時間を測る。閾値 fail は設けない (可視化のみ)。
      - name: Record job start time (#565)
        run: echo "NOOBDB_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # RUSTC_WRAPPER=sccache を有効にしているため、rustc を呼ぶ後続ステップ
      # (rust-cache のツールチェーン情報取得など) より前に sccache 本体を導入する。
      - name: Install sccache
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: sccache

      # clippy は check モードでリンクしないが、build.rs (tauri-build 等) の
      # 生成・実行で linker を使うため clang + mold は必要
      # (src-tauri/.cargo/config.toml が Linux ターゲットのリンカに指定)。
      #
      # #770 で rust (test) に導入したパターンを横展開 (#771)。apt は I/O 律速で、
      # 後続の Rust プリアンブル (toolchain 導入・キャッシュ復元) は apt パッケージを
      # 必要としない (clang/mold はリンク時 = clippy が build.rs を生成・実行する
      # タイミングで初めて要る) ため、background: true で非同期起動して Rust
      # プリアンブルと重ね、壁時計を短縮する。dpkg のロックはこの apt ステップだけが
      # 握り、並走する他ステップ (rustup / cache 復元) は apt/dpkg を使わないため
      # 競合しない。実際にパッケージを要する cargo clippy の前に wait で完了を保証する。
      # ランナーイメージに焼き込まれた apt インデックスは古く、アーカイブから既に
      # 削除された旧バージョンの .deb を参照して 404 で install が失敗することがある
      # (2026-07-23 に gst-plugins-good の 1ubuntu1.4 参照で発生。アーカイブには
      # 後継の 1ubuntu1.5 のみ存在)。cache-apt-pkgs-action 内部の update は実際には
      # インデックスを更新できていない (実測 1 秒未満で完了しリストが古いまま) ため、
      # ここで (1) ミラーを本家 archive.ubuntu.com に差し替え (Azure ミラー自体の
      # インデックス/プール同期ズレも回避)、(2) 自前の apt-get update でリストを
      # 確実に最新化してから action に渡す。効くのはキャッシュミス時のクリーン
      # インストール経路だけで、キャッシュヒット時の所要時間には影響しない。
      - name: Use canonical apt archive + refresh indexes (stale runner lists cause 404)
        run: |
          printf 'http://archive.ubuntu.com/ubuntu\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update

      - name: System deps (Tauri 2 prerequisites)
        id: apt
        background: true
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev build-essential curl wget file libssl-dev clang mold
          # version はキャッシュキーの一部。上記 404 の間に action が「0 パッケージの
          # 空キャッシュ」を保存してしまった場合、同じキーでの再実行は空キャッシュを
          # 復元して失敗し続けるため、キーを進めて無効化する
          # (tauri-2 〜 tauri-4 は 2026-07-23 に汚染)。
          version: tauri-5

      # Rust の単体 / 統合テストは __test_api 経由で db::Connection を駆動するだけで
      # webview も run() も起動せず、実フロント資産を必要としない。tauri::generate_context!
      # が参照する frontendDist (../dist) を満たすには dist/index.html が存在すれば足りる
      # ため、pnpm install + build の代わりに最小スタブを 1 枚生成する (#796)。実フロント
      # ビルドの検証は専用の frontend ジョブに一本化しており、Rust ジョブで再ビルドしても
      # カバレッジ上の意味はない。これにより 4 Rust ジョブ×(pnpm install + build) 分の時間・
      # キャッシュ I/O と pnpm 関連ステップ (setup-node / corepack / store キャッシュ) を
      # 削減する。
      - name: Stub frontend dist (for tauri::generate_context!)
        shell: bash
        run: mkdir -p dist && echo "" > dist/index.html

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Cache cargo
        id: rust-cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: clippy

      # sccache のローカルディスクキャッシュを永続化する。キーは Cargo.lock の
      # ハッシュ + ジョブ種別 (clippy) で分け、rust-cache の target キャッシュとは
      # 別物として管理する。Cargo.lock が変わってもプレフィックス一致で前回分を
      # 復元し、差分のみ再コンパイルする。
      - name: Cache sccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ runner.os }}-clippy-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-clippy-

      # 非同期起動した apt (システム依存) の完了を待ち合わせる。以降の cargo clippy は
      # その成果 (clang/mold) を必要とする。dist/ は上のスタブステップで既に用意済み。
      # apt が失敗した場合はこの wait でジョブが fail する (公式仕様)。
      - name: Wait for background setup (apt)
        wait: [apt]

      # clippy は rustc ドライバなので型チェック (cargo check 相当) を内包する。
      # 別途 cargo check を走らせると、共有されないコンパイルがほぼ二重に走るため
      # clippy のみに集約している。
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      # ジョブ所要時間・rust-cache ヒット・sccache ヒット率を Job Summary へ
      # 出力する (#565)。#417 の sccache stats (ログ出力) を Job Summary 可視化へ
      # 拡張し、バンドルサイズ (#443) / カバレッジ (#482) と同じく可視化のみで
      # fail はさせない。
      - name: Job timing & cache summary (#565)
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - NOOBDB_JOB_START ))
          {
            echo "### rust (clippy) 所要時間・キャッシュ"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| 所要時間 | ${ELAPSED} 秒 |"
            echo "| rust-cache (target) ヒット | ${{ steps.rust-cache.outputs.cache-hit }} |"
            echo ""
            echo '<details><summary>sccache --show-stats</summary>'
            echo ''
            echo '```'
            sccache --show-stats
            echo '```'
            echo ''
            echo '</details>'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  # 依存ライセンスの許可リスト検査と、RustSec Advisory DB による既知脆弱性チェック
  # を cargo-deny で行う (#332)。設定は src-tauri/deny.toml。cargo metadata を読む
  # だけでコンパイルは不要なため、Tauri のシステム依存やフロントエンドビルドは要らず
  # 軽量に走る。cargo-deny は他ツールと同様 taiki-e/install-action でプリビルド
  # バイナリを入れる (新しいアクションを増やさず既存の固定 SHA に揃える)。
  rust-deny:
    name: rust (deny)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny --manifest-path src-tauri/Cargo.toml check

  rust-test:
    name: rust (test)
    needs: changes
    # #853: 通常の rust==true / workflow==true に加え、crosslang==true
    # (src/__tests__/fixtures/** の変更) でも起動する。このジョブが実行する
    # `cargo llvm-cov nextest` には Rust 側の言語横断ゴールデンテスト
    # (serde_schema_parity.rs / read_only_golden.rs / error_kind_golden.rs /
    # error_hint_golden.rs。いずれも include_str! で共有フィクスチャを読む) が
    # 含まれており、フィクスチャだけを変更する PR (src-tauri/** は無変更 =
    # rust==false) でもこの OR がないとまさにその変更を検証すべきテストが
    # 1 本もスキップされてしまう。
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.crosslang == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      # sccache をコンパイルキャッシュとして使う (#417)。カバレッジ計装ビルド
      # (-C instrument-coverage) は sccache がキャッシュ対象外として素通しするため、
      # 主な効果は依存クレートのコンパイルに現れる。rust-cache (target) とは別管理。
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      # ジョブ全体の所要時間可視化 (#565) の起点。checkout より前に置き、
      # セットアップ込みの壁時計時間を測る。閾値 fail は設けない (可視化のみ)。
      - name: Record job start time (#565)
        run: echo "NOOBDB_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # RUSTC_WRAPPER=sccache を有効にしているため、rustc を呼ぶ後続ステップより
      # 前に sccache 本体を導入する。
      - name: Install sccache
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: sccache

      # clang + mold はビルド高速化用 (src-tauri/.cargo/config.toml が
      # Linux ターゲットのリンカに clang + mold を指定している)。mold で
      # テストバイナリ群のリンク時間を短縮する。
      # openssh-server は SSH トンネル統合テスト (#331) 用。テスト内で sshd を
      # 127.0.0.1:2222 に立て、パスワード/鍵認証のトンネル確立を実走させる。
      #
      # このジョブで最も重い I/O 律速ステップの一つ。後続の Rust ツールチェーン/
      # ツール導入・キャッシュ復元・フロントビルドはいずれも apt パッケージを必要と
      # しない (clang/mold はリンク時 = nextest 実行時に初めて要り、openssh-server は
      # 後段の sshd 起動でのみ要る) ため、GitHub Actions のステップ並列実行 (GA /
      # 2026-06) の background: true で非同期起動し、Rust プリアンブルと重ねて壁時計
      # を短縮する。実際にパッケージが要る sshd 起動と nextest コンパイルの前に wait で
      # 完了を保証する。dpkg のロックはこの apt ステップだけが握り、並走する他ステップ
      # (setup-node / rustup / taiki-e ツール導入 / cache 復元) は apt/dpkg を使わない
      # ため競合しない。
      # クリッピージョブ側と同じ理由の stale インデックス対策 (ミラー差替 + 自前
      # update)。詳細はそちらのコメントを参照。
      - name: Use canonical apt archive + refresh indexes (stale runner lists cause 404)
        run: |
          printf 'http://archive.ubuntu.com/ubuntu\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update

      - name: System deps (Tauri 2 prerequisites)
        id: apt
        background: true
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev build-essential curl wget file libssl-dev clang mold openssh-server
          # クリッピージョブ側と同じ理由のキーバンプ (tauri-2-ssh 〜 tauri-4-ssh は
          # 2026-07-23 に空キャッシュで汚染)。詳細はそちらのコメントを参照。
          version: tauri-5-ssh

      # Rust の単体 / 統合テストは __test_api 経由で db::Connection を駆動するだけで
      # webview も run() も起動せず、実フロント資産を必要としない。tauri::generate_context!
      # が参照する frontendDist (../dist) を満たすには dist/index.html が存在すれば足りる
      # ため、pnpm install + build の代わりに最小スタブを 1 枚生成する (#796)。実フロント
      # ビルドの検証は専用の frontend ジョブに一本化しており、Rust ジョブで再ビルドしても
      # カバレッジ上の意味はない。これにより 4 Rust ジョブ×(pnpm install + build) 分の時間・
      # キャッシュ I/O と pnpm 関連ステップ (setup-node / corepack / store キャッシュ) を
      # 削減する。
      - name: Stub frontend dist (for tauri::generate_context!)
        shell: bash
        run: mkdir -p dist && echo "" > dist/index.html

      # llvm-tools-preview は cargo-llvm-cov の計装ビルドに必要なコンポーネント。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        id: rust-cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: test

      # sccache のローカルディスクキャッシュを永続化する (ジョブ種別 test で分離)。
      - name: Cache sccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ runner.os }}-test-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-test-

      # sshd 起動 (#331) は openssh-server を要するため、background 化した apt の完了を
      # まず待つ。ここで待つのは apt だけで、sshd はこの後 background 起動し nextest 直前の
      # wait で待つ。#770 では sshd 起動 (約 22 秒) を $GITHUB_ENV の
      # タイミング安全性を優先して直列のまま critical path に残していたが、公式仕様では
      # background ステップの env はそれを含む wait 以降で利用可能なので、sshd も
      # background 化して Rust ツール導入 (DL 律速) と重ねられる (#771)。
      # TLS 統合テスト用 DB セットアップ (#520/#795、下記) がフォールバックで
      # apt-get install する場合の dpkg ロック競合を避けるため、ここで同じ apt 完了を
      # 待ってから起動する。
      - name: Wait for apt (openssh-server needed by sshd)
        wait: [apt]

      # SSH トンネル統合テスト (#331) 用の sshd を起動し、接続情報を $GITHUB_ENV へ。
      # apt (openssh-server) 完了後に background: true で非同期起動し、下の
      # cargo-nextest / cargo-llvm-cov 導入 (DL 律速) と重ねて壁時計を短縮する。
      # サービスコンテナ (要イメージ pull) ではなく apt の openssh-server を直接構成
      # する方式 (ローカルでも同手順を再現・検証できる。scripts/ci-setup-sshd.sh)。
      # 書き込む NOOBDB_TEST_SSH_URL / NOOBDB_TEST_SSH_KEY は、この background を含む
      # 下の wait 以降で初めて nextest から参照可能になる (公式仕様)。
      - name: Setup test sshd (SSH tunnel integration)
        id: sshd
        background: true
        run: bash scripts/ci-setup-sshd.sh

      # 実 TLS サーバに対する統合テスト (#520 の既知ギャップ、#795) 用に、自己署名
      # CA + サーバ証明書を生成し、TLS 必須の MySQL/PostgreSQL を別ポート
      # (3307/5433) で起動する。下の「MySQL/PostgreSQL サービスコンテナ (平文)」とは
      # 別の独立したインスタンスで、サービスコンテナは変更しない — サービスコンテナは
      # 他のどのステップよりも前に起動するため証明書を後から渡せず、加えて
      # `services:` には `command:` (エントリポイント引数上書き) が無く公式 postgres
      # イメージへ `-c ssl=on` のような起動引数を渡す手段が無いため、サービス
      # コンテナへの TLS 導入は最小侵襲にならないと判断した (詳細は
      # scripts/ci-setup-tls-db.sh 冒頭のコメントと CLAUDE.md の
      # 「TLS 統合テスト方針」を参照)。mysql-server/postgresql は ubuntu-latest
      # ランナーに既定でプリインストール済みのため、通常はこの background 起動が
      # 追加の apt ダウンロードを伴わず高速に完了する。sshd と同じく apt 完了後に
      # background 起動し、下のツール導入と重ねる。
      - name: Setup TLS test databases (TLS integration #520/#795)
        id: tlsdb
        background: true
        run: bash scripts/ci-setup-tls-db.sh

      # cargo-nextest / cargo-llvm-cov の導入は DL 律速で、上の sshd / TLS DB 起動と
      # CPU を食い合わないため重ねて走らせる。
      - name: Install cargo-nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-llvm-cov

      # 残る background (sshd = SSH 接続情報 / tlsdb = TLS DB 接続情報。いずれも
      # $GITHUB_ENV 経由) の完了を nextest の直前で待ち合わせる。両者の env は
      # この wait 以降で利用可能になり、SSH トンネル統合テスト (#331) と TLS 統合
      # テスト (#520/#795) が nextest で正しく実走する。dist/ は上のスタブステップで
      # 既に用意済み。sshd/tlsdb のいずれかが失敗した場合はこの wait でジョブが
      # fail する (公式仕様)。
      - name: Wait for background setup (sshd, TLS test DBs)
        wait: [sshd, tlsdb]

      # nextest を llvm-cov 計装下で実行し、カバレッジ生データのみ収集する
      # (--no-report)。MySQL/PostgreSQL の両サービスコンテナを指す URL を渡し、
      # 両ドライバの統合テストを CI で実走させる。SQLite は環境変数不要で常に走る。
      # NOOBDB_TEST_SSH_URL / NOOBDB_TEST_SSH_KEY と
      # NOOBDB_TEST_MYSQL_TLS_URL / NOOBDB_TEST_POSTGRES_TLS_URL / NOOBDB_TEST_TLS_CA
      # は、それぞれ background の「Setup test sshd」/「Setup TLS test databases」が
      # $GITHUB_ENV へ書き込み、直前の wait: [sshd, tlsdb] 以降で参照可能になるため、
      # SSH トンネル統合テスト (#331) と TLS 統合テスト (#520/#795) もここで実走する。
      - name: cargo llvm-cov nextest
        working-directory: src-tauri
        env:
          NOOBDB_TEST_MYSQL_URL: mysql://root:rootpw@127.0.0.1:3306/testdb
          NOOBDB_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/testdb
        run: cargo llvm-cov nextest --no-report --locked --all-targets

      # 収集済みデータから lcov レポートを生成し、サマリ表を Job Summary に出して
      # PR ごとのカバレッジを可視化する。
      - name: Coverage report
        working-directory: src-tauri
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          {
            echo '### Rust coverage'
            echo ''
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 品質ゲート (#290): 行カバレッジが閾値を下回ったら CI を fail させる。
      # サマリ出力の後に置くことで、閾値割れで落ちても Job Summary には実測値が
      # 残り、原因を追いやすくする。
      #
      # 閾値はラチェット式 (下げない) で運用する (#482)。テスト整備の進捗に応じて
      # 実測を**わずかに下回る**値へ段階的に引き上げ、品質の後退を防ぐ。
      # 48 → 60 への更新根拠: 全統合テスト (MySQL/PostgreSQL/SSH を含む) 実走時の
      # 実測が lines 63.3% (Epic #397 のテスト整備 — read-only ゴールデン #444・
      # diff/sync #480・タイムアウト/キャンセル #481・introspection #493・SSH #331 —
      # により上昇)。CI の nextest と libtest で計測差はごく小さい (doctest なし) ため、
      # 実測−約 3pt の 60 を CI で確実に通る保守的なベースラインとする。下げないのが
      # 原則で、次の引き上げは更なるテスト整備で実測が上がってから行う。
      - name: Enforce coverage threshold
        working-directory: src-tauri
        run: cargo llvm-cov report --fail-under-lines 60

      # ジョブ所要時間・rust-cache ヒット・sccache ヒット率を Job Summary へ
      # 出力する (#565)。#417 の sccache stats (ログ出力) を Job Summary 可視化へ
      # 拡張し、バンドルサイズ (#443) / カバレッジ (#482) と同じく可視化のみで
      # fail はさせない。
      - name: Job timing & cache summary (#565)
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - NOOBDB_JOB_START ))
          {
            echo "### rust (test) 所要時間・キャッシュ"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| 所要時間 | ${ELAPSED} 秒 |"
            echo "| rust-cache (target) ヒット | ${{ steps.rust-cache.outputs.cache-hit }} |"
            echo ""
            echo '<details><summary>sccache --show-stats</summary>'
            echo ''
            echo '```'
            sccache --show-stats
            echo '```'
            echo ''
            echo '</details>'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  # Windows ターゲットの PR 事前検証 (#392)。Rust のコンパイル・テストは普段
  # Linux でしか走らず、Windows 固有の挙動 (keyring・ファイルパス・改行コード・
  # MSVC リンカ) のリグレッションは release.yml の main push まで検出できなかった。
  # ここで PR 段階で clippy + SQLite ユニット/統合テストを Windows 上で実行する。
  # Tauri の全スタックビルド (WebView2 等) は不要で、MSVC toolchain のみで足りる。
  # MySQL/PostgreSQL は接続 URL 環境変数を渡さないので統合テストはスキップされ、
  # SQLite 統合テスト (外部サービス不要) は常時実行される。
  #
  # Linux と同じ理由 (rust-clippy / rust-test の分割コメント参照) で clippy と
  # nextest を別ジョブに分けて並列実行する。同一ジョブで直列に走らせると
  # check モードと codegen+link の成果物が共有されず実質二重コンパイルが直列に
  # 積み上がり、Windows ジョブがワークフロー全体のクリティカルパスになっていた
  # (実測 clippy 約 4 分 + nextest 約 4.5 分)。分割で壁時計時間を max() に縮める。
  rust-windows-clippy:
    name: rust (windows clippy)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      # Linux ジョブと同じく sccache でコンパイルキャッシュを効かせる (#417)。
      # キャッシュキーは runner.os (Windows) を含むので Linux とは自動的に分離される。
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      # ジョブ全体の所要時間可視化 (#565) の起点。checkout より前に置き、
      # セットアップ込みの壁時計時間を測る。閾値 fail は設けない (可視化のみ)。
      # windows-latest の既定シェルは pwsh なので、他の GITHUB_ENV 書き込み
      # ステップと同様に明示的に bash を指定する。
      - name: Record job start time (#565)
        shell: bash
        run: echo "NOOBDB_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # RUSTC_WRAPPER=sccache を有効にしているため、rustc を呼ぶ後続ステップより
      # 前に sccache 本体を導入する。
      - name: Install sccache
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: sccache

      # Rust の単体 / 統合テストは __test_api 経由で db::Connection を駆動するだけで
      # webview も run() も起動せず、実フロント資産を必要としない。tauri::generate_context!
      # が参照する frontendDist (../dist) を満たすには dist/index.html が存在すれば足りる
      # ため、pnpm install + build の代わりに最小スタブを 1 枚生成する (#796)。実フロント
      # ビルドの検証は専用の frontend ジョブに一本化しており、Rust ジョブで再ビルドしても
      # カバレッジ上の意味はない。これにより 4 Rust ジョブ×(pnpm install + build) 分の時間・
      # キャッシュ I/O と pnpm 関連ステップ (setup-node / corepack / store キャッシュ) を
      # 削減する。
      - name: Stub frontend dist (for tauri::generate_context!)
        shell: bash
        run: mkdir -p dist && echo "" > dist/index.html

      # Windows では config.toml が MSVC リンカに lld-link を指定している。
      # windows-latest には LLVM がプリインストール済みで lld-link が PATH 上にある。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Cache cargo
        id: rust-cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: windows-clippy

      - name: Cache sccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ runner.os }}-windows-clippy-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-windows-clippy-

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      # ジョブ所要時間・rust-cache ヒット・sccache ヒット率を Job Summary へ
      # 出力する (#565)。#417 の sccache stats (ログ出力) を Job Summary 可視化へ
      # 拡張し、バンドルサイズ (#443) / カバレッジ (#482) と同じく可視化のみで
      # fail はさせない。
      - name: Job timing & cache summary (#565)
        if: always()
        shell: bash
        run: |
          ELAPSED=$(( $(date +%s) - NOOBDB_JOB_START ))
          {
            echo "### rust (windows clippy) 所要時間・キャッシュ"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| 所要時間 | ${ELAPSED} 秒 |"
            echo "| rust-cache (target) ヒット | ${{ steps.rust-cache.outputs.cache-hit }} |"
            echo ""
            echo '<details><summary>sccache --show-stats</summary>'
            echo ''
            echo '```'
            sccache --show-stats
            echo '```'
            echo ''
            echo '</details>'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  rust-windows-test:
    name: rust (windows test)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      # ジョブ全体の所要時間可視化 (#565) の起点。checkout より前に置き、
      # セットアップ込みの壁時計時間を測る。閾値 fail は設けない (可視化のみ)。
      # windows-latest の既定シェルは pwsh なので、他の GITHUB_ENV 書き込み
      # ステップと同様に明示的に bash を指定する。
