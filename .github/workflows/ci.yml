      # SQLite 統合テスト (tests/sqlite_integration.rs) は外部サービス不要で常時
      # 実行される。MySQL/PostgreSQL は URL 環境変数を渡していないのでスキップ。
      - name: cargo nextest run
        working-directory: src-tauri
        run: cargo nextest run --locked --all-targets

      # ジョブ所要時間・rust-cache ヒット・sccache ヒット率を Job Summary へ
      # 出力する (#565)。#417 の sccache stats (ログ出力) を Job Summary 可視化へ
      # 拡張し、バンドルサイズ (#443) / カバレッジ (#482) と同じく可視化のみで
      # fail はさせない。
