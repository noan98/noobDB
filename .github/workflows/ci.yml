name: ci

# pull_request に加えて main への push でも起動する。pull_request 実行で保存される
# キャッシュ (rust-cache / sccache / pnpm) は PR のマージ ref スコープにしか残らず
# 他の PR からは参照できないため、main push 時に同じジョブを走らせてキャッシュを
# main スコープへ保存する (全 PR ブランチがフォールバックで復元できる唯一のスコープ)。
# これが無いと新規 PR ブランチの初回 Rust ビルドは毎回コールドになる。マージ後の
# main の健全性確認 (post-merge check) も兼ねる。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# PR の古い run だけ取り消す。main への push は取り消さない (連続 push で
# 途中のコミットの検証が抜けるのを防ぐ。#1632)。cancel-in-progress: false でも
# 同一グループの「待機中」run は新しい run に取り消されるため、push はグループを
# SHA 単位にして全件を完走させる。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# corepack が pnpm を取得する際の対話プロンプトを無効化 (CI は非対話)。
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  # 変更されたパスを見て後続ジョブを出し分ける。ワークフロー単位の paths で
  # 丸ごとスキップすると必須チェックが「待機中」のまま固まるため、ここでは
  # ジョブ単位の if: でゲートする (スキップは必須チェックを満たす)。
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    # 各ジョブに timeout-minutes を付け、ハング時にデフォルト 6 時間ランナーを
    # 占有し続けるのを防ぐ (実測に余裕を持たせた保守的な上限。正常時は影響なし)。
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      workflow: ${{ steps.filter.outputs.workflow }}
      crosslang: ${{ steps.filter.outputs.crosslang }}
      ci-scripts: ${{ steps.filter.outputs.ci-scripts }}
      docs: ${{ steps.filter.outputs.docs }}
      automerge: ${{ steps.filter.outputs.automerge }}
    steps:
      # pull_request イベントでは paths-filter は API 比較で checkout 不要だが、
      # push (main) イベントではローカルの git 履歴を比較するため checkout が必要。
      # push 比較は直前コミットとの差分なので、親コミットまで含む fetch-depth: 2 で
      # paths-filter が自前 fetch にフォールバックせず確実に履歴比較できるようにする。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            workflow:
              - '.github/workflows/ci.yml'
            frontend:
              - 'src/**'
              - 'index.html'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'vite.config.ts'
              - 'vitest.browser.config.ts'
              # #1076: knip の設定だけを変えた PR (tags / ignore の追加など) でも
              # `pnpm run knip` を再実行し、デッドコード検出の緩和を素通りさせない。
              - 'knip.json'
              # #1176: Biome の設定 / 警告件数チェックのスクリプトだけを変えた PR でも
              # `pnpm run lint` を再実行する (formatter の設定もここ)。
              - 'biome.json'
              # #1359: frontend ジョブが呼ぶバンドルサイズ計測スクリプトだけを変えたPRでも
              # 実走させる。
              - 'scripts/bundle-size.mjs'
            rust:
              - 'src-tauri/**'
            # #853: 言語横断のゴールデン/パリティテスト (Rust 側の
            # serde_schema_parity.rs / read_only_golden.rs / error_kind_golden.rs /
            # error_hint_golden.rs) が include_str! で読む共有フィクスチャだけが
            # 変わった PR は frontend==true だが rust==false になるため、
            # `rust (test)` / `rust (coverage)` ジョブの if: にこの crosslang を OR で足して確実に
            # 実走させる (詳細は下の `crosslang parity` ジョブのコメント参照)。
            crosslang:
              - 'src/__tests__/fixtures/**'
            # #1359: SSH / TLS / 平文DB統合テストが依存するCIセットアップスクリプト
            # だけを変えたPRは rust==false になり、変更したスクリプトがPR上で一度も
            # 実行されない。`rust (test)` / `rust (coverage)` の if: にORで足して実走させる
            # (crosslang と同じパターン)。
            ci-scripts:
              - 'scripts/ci-setup-*.sh'
            # docCommandParity.test.ts が ?raw で読む IPC コマンド一覧ドキュメント。
            # このファイルだけを編集した PR (一覧から誤ってコマンドを消した等) でも
            # パリティ検証が実走するよう、`crosslang parity` ジョブの if: へ OR で
            # 足す。Rust テストはこのドキュメントを読まないので `rust (test)` には
            # 足さない。
            docs:
              - '.claude/skills/noobdb-ipc/references/command-list.md'
            # #1108: automerge の変更依頼ゲートの判定スクリプトとそのテスト、
            # それを呼ぶ automerge.yml。`automerge gate (script tests)` ジョブを起動する。
            automerge:
              - 'scripts/automerge-hold.mjs'
              - 'scripts/automerge-hold.test.mjs'
              - 'scripts/automerge-notice.mjs'
              - 'scripts/automerge-notice.test.mjs'
              - '.github/workflows/automerge.yml'
              # #1633: トラッキング Issue upsert スクリプトとそのテストも同じジョブで回す。
              - 'scripts/upsert-tracking-issue.sh'
              - 'scripts/upsert-tracking-issue.test.mjs'

  # フロントエンドの typecheck/build/lint/単体テストと、実ブラウザでの描画/
  # ビジュアル回帰テストを 1 ジョブに統合している (#908)。旧来は `frontend` と
  # `frontend-visual` の 2 ジョブに分かれていたが、両ジョブが独立して
  # `pnpm install --frozen-lockfile` を実行し、Vite の依存プリバンドル (esbuild)
  # によるソース変換もそれぞれ別個に行っていたため、フロント資産の重複処理
  # (pnpm install ×2・トランスパイル ×2) が発生していた (Rust ジョブ側の同型の
  # 重複を解消した #796 の横展開)。
  #
  # #796 は「Rust の単体/統合テストは実フロント資産を必要としない
  # (dist/index.html のスタブで足りる)」性質を利用して重複ビルドそのものを
  # 消したが、本ジョブ (旧 frontend-visual) は実際にコンポーネントをレンダリング
  # するため dist/ のスタブ化は使えない。加えて `pnpm run build` (本番ビルド、
  # tsc + Rollup) と `pnpm test:browser` (Vitest ブラウザモード、Vite dev サーバの
  # 依存プリバンドルキャッシュ `node_modules/.vite` を使う) はそもそも別パイプラインで
  # 成果物 (dist/) を共有できないため、dist/ をジョブ間で受け渡す方式では重複を
  # 解消できない。そのため「1 ジョブに統合し、pnpm install とセットアップを 1 回に
  # 集約する」方式を採用した (#796 の「不要な作業自体を無くす」方針を、こちらでは
  # 「両ジョブが必要とする作業を 1 回にまとめる」形で踏襲している)。
  #
  # トレードオフ (要検討事項): 旧 `frontend` / `frontend-visual` は並列実行だった
  # ため壁時計は max(typecheck+build 系, ブラウザテスト系) だったが、統合後は
  # 直列実行の合計になる。実測ではいずれも Rust 側ジョブ (特に `rust (test)`、#1872 の統合後は `rust (windows)` も) の
  # MySQL/PostgreSQL 統合テスト。カバレッジ計装は #1153 で非ブロッキングの
  # `rust (coverage)` へ分離済み) がワークフロー全体の
  # クリティカルパスであり、フロント側を直列化しても全体の壁時計時間への影響は
  # 小さいと判断した。一方でブラウザテスト側の「install/トランスパイル部」
  # (pnpm install の再実行・Vite 依存プリバンドルのコールドスタート) は統合により
  # 実行そのものが 1 回に減り (同一ジョブ内で node_modules・ファイルシステム
  # キャッシュが確実に温まった状態から始まる)、加えて Playwright の Chromium
  # バイナリも actions/cache で永続化したため、キャッシュヒット時は再ダウンロード
  # も避けられる。
  #
  # 必須チェック名への影響: 旧来の `frontend (typecheck + build)` と
  # `frontend (browser render + visual)` の 2 つのチェック名は本統合で消え、
  # 単一の `frontend (build + browser tests)` に置き換わる。GitHub のブランチ
  # 保護で必須チェックにこれらの旧名を指定していた場合は、新しいジョブ名へ
  # 設定し直す必要がある (ブランチ保護設定はリポジトリのコードで管理していない
  # ため、本 PR のマージ後に GitHub 側の設定を手動更新する)。
  frontend:
    name: frontend (build + browser tests)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ジョブ全体の所要時間可視化 (#565) の起点。checkout より前に置き、
      # セットアップ込みの壁時計時間を測る。閾値 fail は設けない (可視化のみ)。
      - name: Record job start time (#565)
        run: echo "NOOBDB_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Get pnpm store directory
        shell: bash
        run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        id: pnpm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Vite の依存プリバンドルキャッシュ (`node_modules/.vite`)。`pnpm run build`
      # (Rollup 本番ビルド) はこのディレクトリを使わないため typecheck/build 側の
      # 高速化には寄与しないが、後段の `pnpm test:browser` (Vitest ブラウザモード
      # = Vite dev サーバ) の esbuild 依存プリバンドルはこのキャッシュを再利用
      # できる。pnpm install の直後 (node_modules 確立後) に配置し、pnpm store
      # キャッシュと同じくブランチ跨ぎ (main push によるキャッシュ温め含む) で有効。
      - name: Cache Vite dependency pre-bundle
        id: vite-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite
          key: ${{ runner.os }}-vite-deps-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts', 'vitest.browser.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-vite-deps-

      # tsc のインクリメンタル型チェック用 `.tsbuildinfo` (#1589)。`tsconfig.json` の
      # `incremental` + `tsBuildInfoFile` で `node_modules/.cache/tsc/` に書かれ、300 本超の
      # テストを含む `src` の再型検査を差分だけにする。pnpm store / Vite プリバンドルと同じく
      # ブランチ跨ぎ (main push による温め含む) で効かせるため、キーは実行ごとに変わる
      # `github.sha` 付きにして毎回保存し、restore-keys で直近のものを復元する。
      # TypeScript のバージョン / tsconfig が変わっても tsc 自身が buildinfo を無効化する
      # ので、キャッシュが古くても型検査結果は変わらない (遅くなるだけ)。
      - name: Cache tsc incremental build info
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/tsc
          key: ${{ runner.os }}-tsc-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tsc-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-
            ${{ runner.os }}-tsc-

      - name: Type-check and build
        run: pnpm run build

      # Biome による静的 lint (#1176) と整形チェック (#1636)。tsc / knip では拾えない握り潰された
      # Promise (noFloatingPromises / noMisusedPromises) と hooks の誤用を止める。`biome check` は
      # formatter も検査するので、未整形のコードもここで落ちる (直すには `pnpm exec biome format --write src`)。
      # 新しい必須チェックは増やさず、frontend ジョブ内のステップとして実行する。
      - name: Lint (Biome)
        run: pnpm run lint

      # ビルド成果物 (dist/) の JS/CSS サイズを計測して Job Summary に出力する
      # (#443)。カバレッジ可視化と同じく当面は閾値による fail を設けず可視化のみ。
      # チャート可視化などライブラリ追加に伴うバンドル肥大化を PR で早期に検知する。
      - name: Bundle size report
        run: pnpm run bundle-size

      # 未使用エクスポート / 到達不能コード / 未使用依存を検出し、モジュール跨ぎの
      # デッドコード (tsc の noUnusedLocals では拾えない) と IPC ラッパ ⇔ UI 利用の
      # ドリフトを防ぐ (#470)。ベースラインは knip.json で green。新規の未使用
      # エクスポートが入ると fail する。
      - name: Dead-code / unused-export check (knip)
        run: pnpm run knip

      # Playwright の Chromium バイナリ本体をキャッシュする。バイナリ本体
      # (数十〜100MB超) の再ダウンロードはこれで避けられる。OS 側の共有ライブラリ /
      # フォント (apt) は actions/cache に馴染まないため、下の「Playwright system
      # deps」で cache-apt-pkgs-action (rust ジョブと同じ) に任せる (#1244)。キーは
      # pnpm-lock.yaml のハッシュに追従させ、Playwright の更新時は自動的に新しい
      # キャッシュキーへ切り替わる。
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # Playwright が chromium に要求する OS パッケージ (共有ライブラリ + スクリーン
      # ショットの描画に効くフォント + xvfb) を列挙する (#1244)。パッケージ名を
      # ハードコードせず、Playwright 自身の一覧 (`install-deps --dry-run` =
      # `apt-get install -s` のシミュレーション結果) から取るため、Playwright /
      # Chromium の更新に自動で追従する。`--with-deps` と同じ集合なのでフォント
      # 構成もビジュアル回帰のベースライン生成環境と変わらない。cache-apt-pkgs-action
      # のキャッシュキーはパッケージ一覧 + version のハッシュなので、一覧が変われば
      # 新しいキーになる。
      # ランナーイメージの apt インデックスは古く 404 になることがあるため、rust
      # ジョブと同じくミラーを本家に差し替えて update してから列挙する
      # (詳細は rust (clippy) の System deps 直前のコメントを参照)。
      # dry-run は未導入パッケージがあると exit 1 を返すので `|| true` で受け、
      # 「  <pkg>」形式の行だけを拾う。
      #
      # この dry-run による列挙は毎回同じ結果になるため、結果のパッケージ一覧を
      # actions/cache に保存して使い回す。ヒット時は dry-run だけを省く (apt-get update
      # は常に行う: cache-apt-pkgs-action はキーの算出にランナーの apt インデックスを
      # 使うため、古いままだとキーがずれてクリーンインストール→404 に回りやすい)。
      # キーは pnpm-lock.yaml (= Playwright のバージョン) + ランナー OS + ISO 週。
      # ISO 週を入れるのは、ランナーイメージが週次で更新されて「事前導入済みの
      # パッケージ」が変わると一覧も変わりうるため、最長 1 週間で取り直すため。
      # 空の一覧は保存しない (空キャッシュ汚染の再発防止)。
      - name: Playwright deps cache key (ISO week)
        id: pw-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright system deps list
        id: pw-deps-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/noobdb-playwright-deps
          key: ${{ runner.os }}-playwright-deps-${{ hashFiles('pnpm-lock.yaml') }}-${{ steps.pw-week.outputs.week }}

      - name: List Playwright system deps (#1244)
        id: pw-deps
        env:
          DEPS_CACHE_HIT: ${{ steps.pw-deps-cache.outputs.cache-hit }}
        run: |
          LIST_FILE="$HOME/.cache/noobdb-playwright-deps/packages.txt"
          printf 'http://archive.ubuntu.com/ubuntu\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update
          if [ "$DEPS_CACHE_HIT" = "true" ] && [ -s "$LIST_FILE" ]; then
            PKGS=$(cat "$LIST_FILE")
            echo "Playwright system deps (cache hit): ${PKGS}"
          else
            PKGS=$(pnpm exec playwright install-deps --dry-run chromium | sed -n 's/^  \([a-z0-9][a-z0-9.+-]*\)$/\1/p' | tr '\n' ' ')
            echo "Playwright system deps: ${PKGS:-<none>}"
            if [ -n "$PKGS" ]; then
              mkdir -p "$(dirname "$LIST_FILE")"
              echo "$PKGS" > "$LIST_FILE"
            fi
          fi
          echo "packages=${PKGS}" >> "$GITHUB_OUTPUT"

      # cache-apt-pkgs-action が失敗した、または 0 パッケージの空キャッシュを静かに
      # 復元した (all-package-version-list が空) 場合だけ、直接 install のフォールバックで
      # 救う。正常時は何もしない。
      - name: Playwright system deps (apt cache)
        id: pw-apt
        if: steps.pw-deps.outputs.packages != ''
        continue-on-error: true
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ steps.pw-deps.outputs.packages }}
          # rust ジョブと同じく、空キャッシュ汚染時にキーを進めて無効化するための版。
          version: playwright-1

      - name: Playwright system deps (fallback install)
        if: steps.pw-deps.outputs.packages != '' && (steps.pw-apt.outcome == 'failure' || steps.pw-apt.outputs.all-package-version-list == '')
        env:
          PKGS: ${{ steps.pw-deps.outputs.packages }}
        run: |
          echo "::warning::cache-apt-pkgs-action が失敗または空キャッシュだったため、apt で直接インストールします (Playwright system deps)"
          # shellcheck disable=SC2086
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $PKGS

      # Playwright の Chromium を導入する。システム依存は上の apt キャッシュ
      # ステップで導入済みなので `--with-deps` は付けない (毎回の apt-get install を
      # 避ける)。--only-shell で headless 実行に必要な chromium-headless-shell のみを
      # 入れて軽量化する。バイナリ本体は上の Cache Playwright browsers で
      # キャッシュヒットしていれば再ダウンロードをスキップする。
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --only-shell chromium

      # 実ブラウザ (Vitest ブラウザモード / Playwright + headless Chromium) で
      # 主要画面のレンダリングとビジュアル回帰を検証する (#306)。上の jsdom 単体
      # テストとは実行環境が異なるが、node_modules・Vite/Playwright のキャッシュは
      # このジョブの前段で既に温まっているため、旧 frontend-visual ジョブが個別に
      # 行っていた pnpm install / セットアップの再実行は不要になった (#908)。
      # Chakra UI 全面移行 (#271) のレイアウト/テーマ追従の退行を実 CSS で捕まえる
      # 受け皿。
      #
      # ビジュアル回帰のベースライン PNG は CI と同一環境 (この ubuntu-latest /
      # Chromium) で生成・コミットする運用 (.github/workflows/visual-baseline.yml の
      # workflow_dispatch で更新)。ローカル (macOS/Windows) の描画差による false
      # positive を避けるため、ベースライン生成は常にこの環境で行う。
      #
      # 主要画面のレンダリングスモーク (screens.browser.test.tsx) に加え、ビジュアル
      # 回帰 (visual.browser.test.tsx) も実行する (#1167)。後者は VITE_RUN_VISUAL=1
      # のときだけ走る describe.runIf でゲートされているため、ここで env を立てて
      # コミット済みベースライン PNG との比較を必須チェックに含める。ベースラインは
      # この環境 (ubuntu-latest / Chromium) と同一で生成されている前提。意図的に
      # 見た目を変えたときは visual-baseline.yml を作業ブランチで実行して更新する。
      - name: Browser render smoke + visual regression (Vitest)
        env:
          VITE_RUN_VISUAL: "1"
        run: pnpm test:browser

      # ジョブ所要時間とキャッシュヒット有無を Job Summary へ出力する (#565)。
      # バンドルサイズ (#443) / カバレッジ (#482) と同じく可視化のみで fail
      # させない。ビルド時間退行 (キャッシュミス・依存増) の早期発見が目的。
      - name: Job timing & cache summary (#565)
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - NOOBDB_JOB_START ))
          {
            echo "### frontend (build + browser tests) 所要時間・キャッシュ"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| 所要時間 | ${ELAPSED} 秒 |"
            echo "| pnpm store キャッシュヒット | ${{ steps.pnpm-cache.outputs.cache-hit }} |"
            echo "| Vite 依存プリバンドルキャッシュヒット | ${{ steps.vite-cache.outputs.cache-hit }} |"
            echo "| Playwright ブラウザキャッシュヒット | ${{ steps.playwright-cache.outputs.cache-hit }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
  # Vitest (jsdom) 単体テストの 4 分割実行。
  #
  # 以前は `frontend` ジョブの 1 ステップ (`pnpm test --coverage`) で、実測約 4 分 15 秒
  # (ジョブ全体の約 3/4) を占めていた。ファイル数 (約 320) が多くワーカー単位で
  # jsdom の起動と import が支配的なため、`--shard` で 4 ランナーに分けて壁時計を縮める。
  # 各 shard は main への push のときだけカバレッジ付きで走らせ (PR では計装コストを
  # 省く)、結果を blob として保存する。閾値の判定は全 shard を統合した値でしか
  # 意味を持たないので、ここでは 0 にして下の `frontend (unit tests)` ジョブで
  # 統合してから (push のときだけ) 強制する。
  frontend-unit:
    name: frontend (unit shard ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 以前は 3 分割だったが、shard ごとの所要時間にばらつきがあった (実測 75〜120 秒)。
        # 4 分割にして最長を縮める。なお `--project dom` / `--project node` で分ける案は、
        # blob を統合したカバレッジが実際より大きく低く出る (全件実行 78.45% に対し 63.35%)
        # ため採用しない。プロジェクトを跨ぐ blob の統合は損失がある。
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Get pnpm store directory
        shell: bash
        run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      # frontend ジョブと同じキーを共有する (同じ OS / lockfile で store の内容は同一)。
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Unit tests (Vitest, shard ${{ matrix.shard }}/4)
        # v8 カバレッジの計装は 1 shard あたり約 27 秒 (約 22%) の上乗せになるため、
        # main への push のときだけ付ける (#1420 の rust (coverage) と同じ運用)。
        # PR では計装なしで blob だけ作り、閾値の強制は main push で行う。
        run: |
          ARGS=(--shard="${{ matrix.shard }}/4" --reporter=blob --reporter=dot --outputFile="vitest-reports/blob-${{ matrix.shard }}.json")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            ARGS+=(--coverage --coverage.thresholds.lines=0)
          fi
          pnpm vitest run "${ARGS[@]}"

      - name: Upload Vitest blob
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # 隠しディレクトリ (先頭 `.`) は upload-artifact が既定で除外するため、
          # 先頭に `.` を付けない名前にする (付けると blob が 0 件になり統合で失敗する)。
          name: vitest-blob-${{ matrix.shard }}
          path: vitest-reports/
          retention-days: 1
          if-no-files-found: ignore

  # 全 shard の blob を統合し、カバレッジ閾値 (`vite.config.ts` の
  # coverage.thresholds, #290 の品質ゲート) を統合値で強制する。単体テストの
  # 合否ゲートもこのジョブが担う (shard のいずれかが落ちたらここで fail させる)。
  # job レベルの `if:` で `!cancelled()` を使うのは、shard 失敗時に「skip」になる
  # (skip は必須チェックを満たしてしまう) のを避け、確実に fail で終えるため。
  frontend-unit-merge:
    name: frontend (unit tests)
    needs: [changes, frontend-unit]
    if: ${{ !cancelled() && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflow == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 同じ run の artifact を gh で取得するために actions: read が要る。
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require all shards to pass
        env:
          SHARDS_RESULT: ${{ needs.frontend-unit.result }}
        run: |
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "::error::Vitest の shard が success ではありません: $SHARDS_RESULT"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Get pnpm store directory
        shell: bash
        run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 各 shard の blob (`vitest-blob-N` artifact) を 1 ディレクトリへ集める。
      - name: Download Vitest blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p vitest-reports-dl vitest-reports
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'vitest-blob-*' --dir vitest-reports-dl
          find vitest-reports-dl -name 'blob-*.json' -exec mv {} vitest-reports/ \;
          ls -l vitest-reports

      # blob を統合する。main への push のときだけ `--coverage` を付けて、
      # `vite.config.ts` の閾値 (lines) を超えているか判定する (shard 側の計装も
      # push 限定。PR では blob の統合と合否判定のみで、カバレッジ閾値は見えない)。
      # このジョブ自体は PR でも必ず走って合否を返す (必須チェック)。
      - name: Merge reports + coverage threshold
        run: |
          ARGS=(--merge-reports=vitest-reports)
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            ARGS+=(--coverage)
          fi
          pnpm vitest run "${ARGS[@]}"

  # 言語横断のパリティ/ゴールデンテスト専用の軽量ジョブ (#853)。
  #
  # 背景: `ipcCommandParity.test.ts` / `ipcArgParity.test.ts` /
  # `streamEventParity.test.ts` は `?raw` インポート (または `import.meta.glob`
  # による網羅列挙。#970) で src-tauri 側のソース (`lib.rs` / `commands/*.rs` /
  # `src-tauri/src/**/*.rs`) を読み、`readOnlyGolden.test.ts` /
  # `errorKindGolden.test.ts` / `errorHintGolden.test.ts` / `schemaParity.test.ts` /
  # `sqlQuotingGolden.test.ts` (#880) / `exportFormatGolden.test.ts` (#879) は
  # Rust の統合テスト (`read_only_golden.rs` 等) と共有するフィクスチャ
  # (`src/__tests__/fixtures/*.json`) を検証する。`apiReachabilityParity.test.ts`
  # (#907) は Rust ソースこそ読まないが、UI 未到達ラッパーの削除は
  # `ipcCommandParity` (= Rust 側登録) と連動して直す必要があるため、同じ
  # 起動条件でここに同居させる。いずれも「相手言語の変更を捕まえる」
  # のが目的だが、従来は Vitest 一式として `frontend` ジョブにのみ含まれていたため
  # `src-tauri/**` のみを変更する PR では `frontend==false` となり、まさにその変更を
  # 検証すべきパリティテストが 1 本も走らなかった。
  #
  # 対応方針 (Issue #853 の (a) を採用): このジョブを新設し、対象の Vitest ファイル
  # だけをピンポイントで実行する。
  #
  # 起動条件 (#1029 で `frontend==true || rust==true || workflow==true` から
  # 変更): このジョブが実行する横断 Vitest ファイル (命名規約 + 個別指定の全件)は、`frontend-unit` の
  # shard 群 (Vitest 全スイートの 4 分割実行) にも既に含まれている。したがって
  # `frontend==true` の PR (`src/__tests__/fixtures/**` ⊂ `src/**` なのでフィクスチャ
  # のみの PR も該当) では、`frontend` ジョブが直前に実行した同じ横断テスト群を、このジョブが
  # 独自の checkout + setup-node + `pnpm install --frozen-lockfile` を挟んで
  # 別ランナーでそのまま再実行するだけの**純粋な重複**になっていた。このジョブの
  # 存在意義は「`frontend` ジョブが走らない rust 専用 PR のカバレッジ穴埋め」
  # (このコメント冒頭の背景を参照) であり、`frontend==true` はその正当化の範囲外
  # なので、`rust==true && frontend!=true` (= rust 専用差分) と `workflow==true`
  # (このワークフロー自身の変更は常に自ジョブも検証) の場合のみに限定する。
  # `frontend==true && rust==true` (両方に触れる PR) では `frontend` ジョブが
  # 既に 横断テストを実走するため、このジョブを skip してもカバレッジは変わらない。
  #
  # カバレッジが保たれることの確認 (4 経路):
  #   - `src/**` のみ変更 (frontend==true, rust==false):
  #     `frontend-unit` の shard 群 が横断テストすべてを実走 (このジョブは skip)。
  #   - `src-tauri/**` のみ変更 (rust==true, frontend==false):
  #     `frontend` ジョブは skip されるため、このジョブが横断テストを実走 (下記 if: の前半)。
  #   - `src/__tests__/fixtures/**` のみ変更:
  #     フィクスチャは `src/**` の部分集合なので必ず frontend==true になり、
  #     上記「`src/**` のみ変更」と同じく `frontend` ジョブがカバーする
  #     (このジョブは skip、Rust 側は `rust (test)` / `rust (coverage)` の `crosslang` OR 条件が別途カバー)。
  #   - ワークフローファイルのみ変更 (workflow==true):
  #     下記 if: の後半 `workflow == 'true'` により常に実走する。
  #
  # 逆方向 (Rust 側のゴールデンテストがフロントのフィクスチャ変更を見逃す問題) は
  # このジョブだけでは塞げない — `serde_schema_parity.rs` / `read_only_golden.rs` /
  # `error_kind_golden.rs` / `error_hint_golden.rs` / `sql_quoting_golden.rs` /
  # `export_format_golden.rs` は
  # `rust (test)` (と `rust (coverage)`) ジョブの中で実行されるため、`src/__tests__/fixtures/**` だけを変更する PR
  # (`rust==false`) では引き続きスキップされてしまう。これは上の `changes` ジョブに
  # 追加した `crosslang` フィルタ (フィクスチャパス限定) を `rust (test)` / `rust (coverage)` の if: へ
  # OR で足すことで塞ぐ (そちらのコメント参照。#1029 でも変更していない)。
  crosslang-parity:
    name: crosslang parity
    needs: changes
    if: (needs.changes.outputs.rust == 'true' && needs.changes.outputs.frontend != 'true') || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Get pnpm store directory
        shell: bash
        run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 言語横断のパリティ/ゴールデンテストのみをピンポイントで実行する。
      # 型チェック・ビルド・knip・カバレッジは `frontend` ジョブの専管なので
      # ここでは行わない (このジョブの役割は起動条件の穴埋めのみ)。
      #
      # 対象は手書きのファイル列挙ではなく**命名規約**で導出する (#1152)。
      # 手書き列挙は新規ゴールデンの追記漏れで「Rust 専用 PR で一度も走らない」
      # テストを生むため、`src/__tests__/` の `*Golden.test.ts` / `*Parity.test.ts`
      # は自動で拾われる。Rust ソースやフィクスチャを読むパリティテストを足すときは
      # この命名規約に従うこと。規約に合わない例外 (awsIam.test.ts / apiModuleLayout.test.ts)
      # だけ個別に足す。src-tauri を import するテストが本フィルタに一致することは
      # `crosslangGatingParity.test.ts` (自身も *Parity.test.ts) がメタテストで固定する (#1760)。
      # (Vitest の位置引数は「パスの部分一致」フィルタなので glob 相当になる。)
      - name: Cross-language parity/golden tests (Vitest)
        run: >-
          pnpm vitest run
          Golden.test.ts
          Parity.test.ts
          src/__tests__/awsIam.test.ts
          src/__tests__/apiModuleLayout.test.ts

  # automerge の変更依頼ゲート (#1108) の判定ロジックと、定期ジョブの通知スクリプト
  # (upsert-tracking-issue.sh, #1633) のユニットテスト。
  # `automerge.yml` は GitHub Actions の実環境 (PR・コメント・レビュー) でしか
  # 動かないため、判定を `scripts/automerge-hold.mjs` の純関数に切り出し、
  # 境界ケース (信頼できる投稿者 / bot / マーカー / push 後の解除 / `/hold` /
  # Request changes など) をここで固定する。Node 標準の `node:test` だけを使い
  # 依存ゼロなので pnpm install は不要 (数秒で終わる)。必須チェックではない。
  automerge-gate:
    name: automerge gate (script tests)
    needs: changes
    if: needs.changes.outputs.automerge == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # automerge.yml が実行時に使うのと同じ Node のメジャーに揃える。
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # `package.json` の `test:scripts` と同じ集合 (scripts/*.test.mjs すべて)。
      # glob にしておけば、テストを足すたびにここを直さなくてよい。
      # pnpm install 不要なので node を直接呼ぶ。
      - name: script unit tests (node --test)
        run: node --test 'scripts/*.test.mjs'

  rust-fmt:
    name: rust (fmt)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

  # clippy と nextest は別ジョブに分割して並列実行する。clippy は cargo check
  # 相当 (メタデータ emit のみ)、nextest は実バイナリ生成 (codegen + link) で、
  # cargo はこの 2 モードの成果物を共有しない。同一ジョブで直列に走らせると依存
  # ツリーが実質二重コンパイルされて積み上がるため、並列ジョブにして壁時計時間を
  # max(clippy, test) に縮める。各ジョブは rust-cache のキーが分かれるので
  # キャッシュは互いに干渉しない。CI では incremental コンパイルは無益で
  # オーバーヘッド・キャッシュ肥大を招くだけなので CARGO_INCREMENTAL=0 にする。
  rust-clippy:
    name: rust (clippy)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      # sccache をコンパイルキャッシュとして使う (#417)。rust-cache が target
      # ディレクトリをキャッシュするのに対し、sccache はコンパイル単位 (rustc 呼び
      # 出し) をキャッシュし、Cargo.lock 変更やキャッシュミス時のクリーンビルドを
      # 高速化する。SCCACHE_DIR を actions/cache で永続化してブランチ跨ぎで再利用する。
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      # ジョブ全体の所要時間可視化 (#565) の起点。checkout より前に置き、
      # セットアップ込みの壁時計時間を測る。閾値 fail は設けない (可視化のみ)。
      - name: Record job start time (#565)
        run: echo "NOOBDB_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # RUSTC_WRAPPER=sccache を有効にしているため、rustc を呼ぶ後続ステップ
      # (rust-cache のツールチェーン情報取得など) より前に sccache 本体を導入する。
      - name: Install sccache
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: sccache

      # clippy は check モードでリンクしないが、build.rs (tauri-build 等) の
      # 生成・実行で linker を使うため clang + mold は必要
      # (src-tauri/.cargo/config.toml が Linux ターゲットのリンカに指定)。
      #
      # #770 で rust (test) に導入したパターンを横展開 (#771)。apt は I/O 律速で、
      # 後続の Rust プリアンブル (toolchain 導入・キャッシュ復元) は apt パッケージを
      # 必要としない (clang/mold はリンク時 = clippy が build.rs を生成・実行する
      # タイミングで初めて要る) ため、background: true で非同期起動して Rust
      # プリアンブルと重ね、壁時計を短縮する。dpkg のロックはこの apt ステップだけが
      # 握り、並走する他ステップ (rustup / cache 復元) は apt/dpkg を使わないため
      # 競合しない。実際にパッケージを要する cargo clippy の前に wait で完了を保証する。
      # ランナーイメージに焼き込まれた apt インデックスは古く、アーカイブから既に
      # 削除された旧バージョンの .deb を参照して 404 で install が失敗することがある
      # (2026-07-23 に gst-plugins-good の 1ubuntu1.4 参照で発生。アーカイブには
      # 後継の 1ubuntu1.5 のみ存在)。cache-apt-pkgs-action 内部の update は実際には
      # インデックスを更新できていない (実測 1 秒未満で完了しリストが古いまま) ため、
      # ここで (1) ミラーを本家 archive.ubuntu.com に差し替え (Azure ミラー自体の
      # インデックス/プール同期ズレも回避)、(2) 自前の apt-get update でリストを
      # 確実に最新化してから action に渡す。効くのはキャッシュミス時のクリーン
      # インストール経路だけで、キャッシュヒット時の所要時間には影響しない。
      - name: Use canonical apt archive + refresh indexes (stale runner lists cause 404)
        run: |
          printf 'http://archive.ubuntu.com/ubuntu\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update

      - name: System deps (Tauri 2 prerequisites)
        id: apt
        background: true
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev build-essential curl wget file libssl-dev clang mold
          # version はキャッシュキーの一部。上記 404 の間に action が「0 パッケージの
          # 空キャッシュ」を保存してしまった場合、同じキーでの再実行は空キャッシュを
          # 復元して失敗し続けるため、キーを進めて無効化する
          # (tauri-2 〜 tauri-4 は 2026-07-23 に汚染)。
          version: tauri-5

      # Rust の単体 / 統合テストは __test_api 経由で db::Connection を駆動するだけで
      # webview も run() も起動せず、実フロント資産を必要としない。tauri::generate_context!
      # が参照する frontendDist (../dist) を満たすには dist/index.html が存在すれば足りる
      # ため、pnpm install + build の代わりに最小スタブを 1 枚生成する (#796)。実フロント
      # ビルドの検証は専用の frontend ジョブに一本化しており、Rust ジョブで再ビルドしても
      # カバレッジ上の意味はない。これにより 4 Rust ジョブ×(pnpm install + build) 分の時間・
      # キャッシュ I/O と pnpm 関連ステップ (setup-node / corepack / store キャッシュ) を
      # 削減する。
      - name: Stub frontend dist (for tauri::generate_context!)
        shell: bash
        run: mkdir -p dist && echo "" > dist/index.html

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Cache cargo
        id: rust-cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: clippy

      # sccache のローカルディスクキャッシュを永続化する。キーは Cargo.lock の
      # ハッシュ + ジョブ種別 (clippy) で分け、rust-cache の target キャッシュとは
      # 別物として管理する。Cargo.lock が変わってもプレフィックス一致で前回分を
      # 復元し、差分のみ再コンパイルする。
      - name: Cache sccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ runner.os }}-clippy-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-clippy-

      # 非同期起動した apt (システム依存) の完了を待ち合わせる。以降の cargo clippy は
      # その成果 (clang/mold) を必要とする。dist/ は上のスタブステップで既に用意済み。
      # apt が失敗した場合はこの wait でジョブが fail する (公式仕様)。
      - name: Wait for background setup (apt)
        wait: [apt]

      # clippy は rustc ドライバなので型チェック (cargo check 相当) を内包する。
      # 別途 cargo check を走らせると、共有されないコンパイルがほぼ二重に走るため
      # clippy のみに集約している。
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      # ジョブ所要時間・rust-cache ヒット・sccache ヒット率を Job Summary へ
      # 出力する (#565)。#417 の sccache stats (ログ出力) を Job Summary 可視化へ
      # 拡張し、バンドルサイズ (#443) / カバレッジ (#482) と同じく可視化のみで
      # fail はさせない。
      - name: Job timing & cache summary (#565)
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - NOOBDB_JOB_START ))
          {
            echo "### rust (clippy) 所要時間・キャッシュ"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| 所要時間 | ${ELAPSED} 秒 |"
            echo "| rust-cache (target) ヒット | ${{ steps.rust-cache.outputs.cache-hit }} |"
            echo ""
            echo '<details><summary>sccache --show-stats</summary>'
            echo ''
            echo '```'
            sccache --show-stats
            echo '```'
            echo ''
            echo '</details>'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  # 依存ライセンスの許可リスト検査と、RustSec Advisory DB による既知脆弱性チェック
  # を cargo-deny で行う (#332)。設定は src-tauri/deny.toml。cargo metadata を読む
  # だけでコンパイルは不要なため、Tauri のシステム依存やフロントエンドビルドは要らず
  # 軽量に走る。cargo-deny は他ツールと同様 taiki-e/install-action でプリビルド
  # バイナリを入れる (新しいアクションを増やさず既存の固定 SHA に揃える)。
  rust-deny:
    name: rust (deny)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny --manifest-path src-tauri/Cargo.toml check

  rust-test:
    name: rust (test)
    needs: changes
    # #1153: 計装なしの `cargo nextest run` を実行する PR ブロッキングの高速ジョブ。
    # カバレッジ計装 (llvm-cov / lcov / 閾値) は並列の非ブロッキングジョブ
    # `rust (coverage)` へ分離した。チェック名 `rust (test)` は必須チェック設定
    # (branch protection) を変えないために維持している。
    # #853: 通常の rust==true / workflow==true に加え、crosslang==true
    # (src/__tests__/fixtures/** の変更) でも起動する。このジョブが実行する
    # `cargo nextest run` には Rust 側の言語横断ゴールデンテスト
    # (serde_schema_parity.rs / read_only_golden.rs / error_kind_golden.rs /
    # error_hint_golden.rs。いずれも include_str! で共有フィクスチャを読む) が
    # 含まれており、フィクスチャだけを変更する PR (src-tauri/** は無変更 =
    # rust==false) でもこの OR がないとまさにその変更を検証すべきテストが
    # 1 本もスキップされてしまう。
    # #1359: ci-scripts==true (scripts/ci-setup-*.sh の変更) でも起動する。
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.crosslang == 'true' || needs.changes.outputs.ci-scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      # sccache をコンパイルキャッシュとして使う (#417)。計装なしビルドなので
      # sccache が通常どおり効く (計装ビルドは `rust (coverage)` に分離, #1153)。
      # rust-cache (target) とは別管理。
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      # ジョブ全体の所要時間可視化 (#565) の起点。checkout より前に置き、
      # セットアップ込みの壁時計時間を測る。閾値 fail は設けない (可視化のみ)。
      - name: Record job start time (#565)
        run: echo "NOOBDB_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # RUSTC_WRAPPER=sccache を有効にしているため、rustc を呼ぶ後続ステップより
      # 前に sccache 本体を導入する。
      - name: Install sccache
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: sccache

      # clang + mold はビルド高速化用 (src-tauri/.cargo/config.toml が
      # Linux ターゲットのリンカに clang + mold を指定している)。mold で
      # テストバイナリ群のリンク時間を短縮する。
      # openssh-server は SSH トンネル統合テスト (#331) 用。テスト内で sshd を
      # 127.0.0.1:2222 に立て、パスワード/鍵認証のトンネル確立を実走させる。
      #
      # このジョブで最も重い I/O 律速ステップの一つ。後続の Rust ツールチェーン/
      # ツール導入・キャッシュ復元・フロントビルドはいずれも apt パッケージを必要と
      # しない (clang/mold はリンク時 = nextest 実行時に初めて要り、openssh-server は
      # 後段の sshd 起動でのみ要る) ため、GitHub Actions のステップ並列実行 (GA /
      # 2026-06) の background: true で非同期起動し、Rust プリアンブルと重ねて壁時計
      # を短縮する。実際にパッケージが要る sshd 起動と nextest コンパイルの前に wait で
      # 完了を保証する。dpkg のロックはこの apt ステップだけが握り、並走する他ステップ
      # (setup-node / rustup / taiki-e ツール導入 / cache 復元) は apt/dpkg を使わない
      # ため競合しない。
      # クリッピージョブ側と同じ理由の stale インデックス対策 (ミラー差替 + 自前
      # update)。詳細はそちらのコメントを参照。
      - name: Use canonical apt archive + refresh indexes (stale runner lists cause 404)
        run: |
          printf 'http://archive.ubuntu.com/ubuntu\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update

      - name: System deps (Tauri 2 prerequisites)
        id: apt
        background: true
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev build-essential curl wget file libssl-dev clang mold openssh-server
          # クリッピージョブ側と同じ理由のキーバンプ (tauri-2-ssh 〜 tauri-4-ssh は
          # 2026-07-23 に空キャッシュで汚染)。詳細はそちらのコメントを参照。
          version: tauri-5-ssh

      # Rust の単体 / 統合テストは __test_api 経由で db::Connection を駆動するだけで
      # webview も run() も起動せず、実フロント資産を必要としない。tauri::generate_context!
      # が参照する frontendDist (../dist) を満たすには dist/index.html が存在すれば足りる
      # ため、pnpm install + build の代わりに最小スタブを 1 枚生成する (#796)。実フロント
      # ビルドの検証は専用の frontend ジョブに一本化しており、Rust ジョブで再ビルドしても
      # カバレッジ上の意味はない。これにより 4 Rust ジョブ×(pnpm install + build) 分の時間・
      # キャッシュ I/O と pnpm 関連ステップ (setup-node / corepack / store キャッシュ) を
      # 削減する。
      - name: Stub frontend dist (for tauri::generate_context!)
        shell: bash
        run: mkdir -p dist && echo "" > dist/index.html

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        id: rust-cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: test

      # sccache のローカルディスクキャッシュを永続化する (ジョブ種別 test で分離)。
      - name: Cache sccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ runner.os }}-test-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-test-

      # sshd 起動 (#331) は openssh-server を要するため、background 化した apt の完了を
      # まず待つ。ここで待つのは apt だけで、sshd はこの後 background 起動し nextest 直前の
      # wait で待つ。#770 では sshd 起動 (約 22 秒) を $GITHUB_ENV の
      # タイミング安全性を優先して直列のまま critical path に残していたが、公式仕様では
      # background ステップの env はそれを含む wait 以降で利用可能なので、sshd も
      # background 化して Rust ツール導入 (DL 律速) と重ねられる (#771)。
      # TLS 統合テスト用 DB セットアップ (#520/#795、下記) がフォールバックで
      # apt-get install する場合の dpkg ロック競合を避けるため、ここで同じ apt 完了を
      # 待ってから起動する。
      - name: Wait for apt (openssh-server needed by sshd)
        wait: [apt]

      # SSH トンネル統合テスト (#331) 用の sshd を起動し、接続情報を $GITHUB_ENV へ。
      # apt (openssh-server) 完了後に background: true で非同期起動し、下の
      # cargo-nextest 導入 (DL 律速) と重ねて壁時計を短縮する。
      # サービスコンテナ (要イメージ pull) ではなく apt の openssh-server を直接構成
      # する方式 (ローカルでも同手順を再現・検証できる。scripts/ci-setup-sshd.sh)。
      # 書き込む NOOBDB_TEST_SSH_URL / NOOBDB_TEST_SSH_KEY は、この background を含む
      # 下の wait 以降で初めて nextest から参照可能になる (公式仕様)。
      - name: Setup test sshd (SSH tunnel integration)
        id: sshd
        background: true
        env:
          # useradd (35 秒前後) を避けるため既存のランナーユーザを使う。
          SSH_USER: runner
        run: bash scripts/ci-setup-sshd.sh

      # 実 TLS サーバに対する統合テスト (#520 の既知ギャップ、#795) 用に、自己署名
      # CA + サーバ証明書を生成し、TLS 必須の MySQL/PostgreSQL を別ポート
      # (3307/5433) で起動する。下の平文の MySQL/PostgreSQL (3306/5432) とは別の独立した
      # インスタンス。かつて平文側をサービスコンテナにしていた頃にこの方式を選んだ理由 —
      # サービスコンテナは
      # 他のどのステップよりも前に起動するため証明書を後から渡せず、加えて
      # `services:` には `command:` (エントリポイント引数上書き) が無く公式 postgres
      # イメージへ `-c ssl=on` のような起動引数を渡す手段が無いため、サービス
      # コンテナへの TLS 導入は最小侵襲にならないと判断した (詳細は
      # scripts/ci-setup-tls-db.sh 冒頭のコメントと CLAUDE.md の
      # 「TLS 統合テスト方針」を参照)。mysql-server/postgresql は ubuntu-latest
      # ランナーに既定でプリインストール済みのため、通常はこの background 起動が
      # 追加の apt ダウンロードを伴わず高速に完了する。sshd と同じく apt 完了後に
      # background 起動し、下のツール導入と重ねる。
      - name: Setup TLS test databases (TLS integration #520/#795)
        id: tlsdb
        background: true
        run: bash scripts/ci-setup-tls-db.sh

      # 平文接続の MySQL / PostgreSQL (3306 / 5432)。以前は `services:` のコンテナ
      # (mysql:8.0 / postgres:16) だったが、イメージ pull とヘルスチェックで起動時に約 30 秒
      # かかっていたため、ランナー同梱のサーバを TLS 版と同じ方式で background 起動する。
      # 接続情報はコンテナ時代と同じ (scripts/ci-setup-plain-db.sh)。
      - name: Setup plain test databases (MySQL / PostgreSQL integration)
        id: plaindb
        background: true
        run: bash scripts/ci-setup-plain-db.sh

      # cargo-nextest の導入は DL 律速で、上の sshd / TLS DB 起動と
      # CPU を食い合わないため重ねて走らせる。
      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest

      # テストバイナリのビルドだけを先に行い、アーカイブに固める。sshd / TLS DB のセットアップ
      # (sshd のユーザ作成などで実測 40〜50 秒) とコンパイルを重ねるのが目的。
      # 単純な `cargo nextest run --no-run` では足りなかった: 後続の `cargo nextest run` が
      # 環境変数 (NOOBDB_TEST_* が増える) の違いで noobdb クレートを再コンパイルし
      # (実測 約 51 秒)、重ねた分が相殺されていた。アーカイブから実行すれば cargo を
      # 呼ばないので再コンパイルは起きない。
      - name: Build tests (overlaps sshd / TLS DB setup)
        working-directory: src-tauri
        run: cargo nextest archive --locked --lib --test '*' --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"

      - name: Wait for background setup (sshd, TLS / plain test DBs)
        wait: [sshd, tlsdb, plaindb]

      # 計装なしの nextest を実行する (PR ブロッキング)。MySQL/PostgreSQL の両
      # サービスコンテナを指す URL を渡し、両ドライバの統合テストを CI で実走させる。
      # SQLite は環境変数不要で常に走る。カバレッジ計装は `rust (coverage)` ジョブ。
      # NOOBDB_TEST_SSH_URL / NOOBDB_TEST_SSH_KEY と
      # NOOBDB_TEST_MYSQL_TLS_URL / NOOBDB_TEST_POSTGRES_TLS_URL / NOOBDB_TEST_TLS_CA
      # は、それぞれ background の「Setup test sshd」/「Setup TLS test databases」が
      # $GITHUB_ENV へ書き込み、直前の wait: [sshd, tlsdb, plaindb] 以降で参照可能になるため、
      # SSH トンネル統合テスト (#331) と TLS 統合テスト (#520/#795) もここで実走する。
      - name: cargo nextest
        working-directory: src-tauri
        env:
          NOOBDB_TEST_MYSQL_URL: mysql://root:rootpw@127.0.0.1:3306/testdb
          NOOBDB_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/testdb
        run: cargo nextest run --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"

      # ジョブ所要時間・rust-cache ヒット・sccache ヒット率を Job Summary へ
      # 出力する (#565)。#417 の sccache stats (ログ出力) を Job Summary 可視化へ
      # 拡張し、バンドルサイズ (#443) / カバレッジ (#482) と同じく可視化のみで
      # fail はさせない。
      - name: Job timing & cache summary (#565)
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - NOOBDB_JOB_START ))
          {
            echo "### rust (test) 所要時間・キャッシュ"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| 所要時間 | ${ELAPSED} 秒 |"
            echo "| rust-cache (target) ヒット | ${{ steps.rust-cache.outputs.cache-hit }} |"
            echo ""
            echo '<details><summary>sccache --show-stats</summary>'
            echo ''
            echo '```'
            sccache --show-stats
            echo '```'
            echo ''
            echo '</details>'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  rust-coverage:
    name: rust (coverage)
    needs: changes
    # #1153: カバレッジ計装 (`cargo llvm-cov nextest`) を `rust (test)` から分離した
    # 非ブロッキングのジョブ。計装ビルド (-C instrument-coverage) は sccache が
    # キャッシュしないため遅く、`rust (test)` と同居させると全 PR のクリティカル
    # パスになっていた。並列に走らせて PR のブロッキング経路から外す。
    # **必須チェックには含めない** (閾値 `--fail-under-lines` の fail は赤く出るが
    # 必須ではないのでマージは止めない運用)。
    #
    # #1420: main への push でのみ走らせ、PR では走らせない。このジョブは `rust (test)` と
    # 同一の最重量の統合環境 (sshd + TLS DB + 平文 DB) を立て、全件 nextest を計装下で
    # 再実行する。非ブロッキングの情報提供 1 本のために rust に触れる全 PR で統合環境を
    # 二重に構築していたため、PR 経路から外してランナー分をおよそ半減する。60% の閾値
    # ゲート (下の Enforce coverage threshold) と Job Summary の可視化は main で維持し、
    # 閾値割れはマージ直後の main の赤で検出する (PR のマージは元々止めていない)。
    # 変更パス条件は `rust (test)` と同じ (#853 の crosslang OR / #1359 の ci-scripts OR
    # を含む)。push 時の changes は直前コミットとの差分で判定される。
    if: github.event_name == 'push' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.crosslang == 'true' || needs.changes.outputs.ci-scripts == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      # sccache をコンパイルキャッシュとして使う (#417)。カバレッジ計装ビルド
      # (-C instrument-coverage) は sccache がキャッシュ対象外として素通しするため、
      # 主な効果は依存クレートのコンパイルに現れる。rust-cache (target) とは別管理。
      # キャッシュキーは `rust (test)` (計装なし) と分離する (#1153)。
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      # ジョブ全体の所要時間可視化 (#565) の起点。checkout より前に置き、
      # セットアップ込みの壁時計時間を測る。閾値 fail は設けない (可視化のみ)。
      - name: Record job start time (#565)
        run: echo "NOOBDB_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # RUSTC_WRAPPER=sccache を有効にしているため、rustc を呼ぶ後続ステップより
      # 前に sccache 本体を導入する。
      - name: Install sccache
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: sccache

      # clang + mold はビルド高速化用 (src-tauri/.cargo/config.toml が
      # Linux ターゲットのリンカに clang + mold を指定している)。mold で
      # テストバイナリ群のリンク時間を短縮する。
      # openssh-server は SSH トンネル統合テスト (#331) 用。テスト内で sshd を
      # 127.0.0.1:2222 に立て、パスワード/鍵認証のトンネル確立を実走させる。
      #
      # このジョブで最も重い I/O 律速ステップの一つ。後続の Rust ツールチェーン/
      # ツール導入・キャッシュ復元・フロントビルドはいずれも apt パッケージを必要と
      # しない (clang/mold はリンク時 = nextest 実行時に初めて要り、openssh-server は
      # 後段の sshd 起動でのみ要る) ため、GitHub Actions のステップ並列実行 (GA /
      # 2026-06) の background: true で非同期起動し、Rust プリアンブルと重ねて壁時計
      # を短縮する。実際にパッケージが要る sshd 起動と nextest コンパイルの前に wait で
      # 完了を保証する。dpkg のロックはこの apt ステップだけが握り、並走する他ステップ
      # (setup-node / rustup / taiki-e ツール導入 / cache 復元) は apt/dpkg を使わない
      # ため競合しない。
      # クリッピージョブ側と同じ理由の stale インデックス対策 (ミラー差替 + 自前
      # update)。詳細はそちらのコメントを参照。
      - name: Use canonical apt archive + refresh indexes (stale runner lists cause 404)
        run: |
          printf 'http://archive.ubuntu.com/ubuntu\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update

      - name: System deps (Tauri 2 prerequisites)
        id: apt
        background: true
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev build-essential curl wget file libssl-dev clang mold openssh-server
          # クリッピージョブ側と同じ理由のキーバンプ (tauri-2-ssh 〜 tauri-4-ssh は
          # 2026-07-23 に空キャッシュで汚染)。詳細はそちらのコメントを参照。
          version: tauri-5-ssh

      # Rust の単体 / 統合テストは __test_api 経由で db::Connection を駆動するだけで
      # webview も run() も起動せず、実フロント資産を必要としない。tauri::generate_context!
      # が参照する frontendDist (../dist) を満たすには dist/index.html が存在すれば足りる
      # ため、pnpm install + build の代わりに最小スタブを 1 枚生成する (#796)。実フロント
      # ビルドの検証は専用の frontend ジョブに一本化しており、Rust ジョブで再ビルドしても
      # カバレッジ上の意味はない。これにより 4 Rust ジョブ×(pnpm install + build) 分の時間・
      # キャッシュ I/O と pnpm 関連ステップ (setup-node / corepack / store キャッシュ) を
      # 削減する。
      - name: Stub frontend dist (for tauri::generate_context!)
        shell: bash
        run: mkdir -p dist && echo "" > dist/index.html

      # llvm-tools-preview は cargo-llvm-cov の計装ビルドに必要なコンポーネント。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        id: rust-cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: coverage

      # sccache のローカルディスクキャッシュを永続化する (ジョブ種別 test で分離)。
      - name: Cache sccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ runner.os }}-coverage-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-coverage-

      # sshd 起動 (#331) は openssh-server を要するため、background 化した apt の完了を
      # まず待つ。ここで待つのは apt だけで、sshd はこの後 background 起動し nextest 直前の
      # wait で待つ。#770 では sshd 起動 (約 22 秒) を $GITHUB_ENV の
      # タイミング安全性を優先して直列のまま critical path に残していたが、公式仕様では
      # background ステップの env はそれを含む wait 以降で利用可能なので、sshd も
      # background 化して Rust ツール導入 (DL 律速) と重ねられる (#771)。
      # TLS 統合テスト用 DB セットアップ (#520/#795、下記) がフォールバックで
      # apt-get install する場合の dpkg ロック競合を避けるため、ここで同じ apt 完了を
      # 待ってから起動する。
      - name: Wait for apt (openssh-server needed by sshd)
        wait: [apt]

      # SSH トンネル統合テスト (#331) 用の sshd を起動し、接続情報を $GITHUB_ENV へ。
      # apt (openssh-server) 完了後に background: true で非同期起動し、下の
      # cargo-nextest / cargo-llvm-cov 導入 (DL 律速) と重ねて壁時計を短縮する。
      # サービスコンテナ (要イメージ pull) ではなく apt の openssh-server を直接構成
      # する方式 (ローカルでも同手順を再現・検証できる。scripts/ci-setup-sshd.sh)。
      # 書き込む NOOBDB_TEST_SSH_URL / NOOBDB_TEST_SSH_KEY は、この background を含む
      # 下の wait 以降で初めて nextest から参照可能になる (公式仕様)。
      - name: Setup test sshd (SSH tunnel integration)
        id: sshd
        background: true
        env:
          # useradd (35 秒前後) を避けるため既存のランナーユーザを使う。
          SSH_USER: runner
        run: bash scripts/ci-setup-sshd.sh

      # 実 TLS サーバに対する統合テスト (#520 の既知ギャップ、#795) 用に、自己署名
      # CA + サーバ証明書を生成し、TLS 必須の MySQL/PostgreSQL を別ポート
      # (3307/5433) で起動する。下の平文の MySQL/PostgreSQL (3306/5432) とは別の独立した
      # インスタンス。かつて平文側をサービスコンテナにしていた頃にこの方式を選んだ理由 —
      # サービスコンテナは
      # 他のどのステップよりも前に起動するため証明書を後から渡せず、加えて
      # `services:` には `command:` (エントリポイント引数上書き) が無く公式 postgres
      # イメージへ `-c ssl=on` のような起動引数を渡す手段が無いため、サービス
      # コンテナへの TLS 導入は最小侵襲にならないと判断した (詳細は
      # scripts/ci-setup-tls-db.sh 冒頭のコメントと CLAUDE.md の
      # 「TLS 統合テスト方針」を参照)。mysql-server/postgresql は ubuntu-latest
      # ランナーに既定でプリインストール済みのため、通常はこの background 起動が
      # 追加の apt ダウンロードを伴わず高速に完了する。sshd と同じく apt 完了後に
      # background 起動し、下のツール導入と重ねる。
      - name: Setup TLS test databases (TLS integration #520/#795)
        id: tlsdb
        background: true
        run: bash scripts/ci-setup-tls-db.sh

      # 平文接続の MySQL / PostgreSQL (3306 / 5432)。以前は `services:` のコンテナ
      # (mysql:8.0 / postgres:16) だったが、イメージ pull とヘルスチェックで起動時に約 30 秒
      # かかっていたため、ランナー同梱のサーバを TLS 版と同じ方式で background 起動する。
      # 接続情報はコンテナ時代と同じ (scripts/ci-setup-plain-db.sh)。
      - name: Setup plain test databases (MySQL / PostgreSQL integration)
        id: plaindb
        background: true
        run: bash scripts/ci-setup-plain-db.sh

      # cargo-nextest / cargo-llvm-cov の導入は DL 律速で、上の sshd / TLS DB 起動と
      # CPU を食い合わないため重ねて走らせる。
      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov

      # 残る background (sshd = SSH 接続情報 / tlsdb = TLS DB 接続情報。いずれも
      # $GITHUB_ENV 経由) の完了を nextest の直前で待ち合わせる。両者の env は
      # この wait 以降で利用可能になり、SSH トンネル統合テスト (#331) と TLS 統合
      # テスト (#520/#795) が nextest で正しく実走する。dist/ は上のスタブステップで
      # 既に用意済み。sshd/tlsdb のいずれかが失敗した場合はこの wait でジョブが
      # fail する (公式仕様)。
      - name: Wait for background setup (sshd, TLS / plain test DBs)
        wait: [sshd, tlsdb, plaindb]

      # nextest を llvm-cov 計装下で実行し、カバレッジ生データのみ収集する
      # (--no-report)。MySQL/PostgreSQL の両サービスコンテナを指す URL を渡し、
      # 両ドライバの統合テストを CI で実走させる。SQLite は環境変数不要で常に走る。
      # NOOBDB_TEST_SSH_URL / NOOBDB_TEST_SSH_KEY と
      # NOOBDB_TEST_MYSQL_TLS_URL / NOOBDB_TEST_POSTGRES_TLS_URL / NOOBDB_TEST_TLS_CA
      # は、それぞれ background の「Setup test sshd」/「Setup TLS test databases」が
      # $GITHUB_ENV へ書き込み、直前の wait: [sshd, tlsdb, plaindb] 以降で参照可能になるため、
      # SSH トンネル統合テスト (#331) と TLS 統合テスト (#520/#795) もここで実走する。
      - name: cargo llvm-cov nextest
        working-directory: src-tauri
        env:
          NOOBDB_TEST_MYSQL_URL: mysql://root:rootpw@127.0.0.1:3306/testdb
          NOOBDB_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/testdb
        run: cargo llvm-cov nextest --no-report --locked --lib --test '*'

      # 収集済みデータから lcov レポートを生成し、サマリ表を Job Summary に出して
      # main の push ごとのカバレッジを可視化する (#1420 で PR からは外した)。
      - name: Coverage report
        working-directory: src-tauri
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          {
            echo '### Rust coverage'
            echo ''
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 品質ゲート (#290): 行カバレッジが閾値を下回ったら CI を fail させる。
      # サマリ出力の後に置くことで、閾値割れで落ちても Job Summary には実測値が
      # 残り、原因を追いやすくする。
      #
      # 閾値はラチェット式 (下げない) で運用する (#482)。テスト整備の進捗に応じて
      # 実測を**わずかに下回る**値へ段階的に引き上げ、品質の後退を防ぐ。
      # 48 → 60 への更新根拠: 全統合テスト (MySQL/PostgreSQL/SSH を含む) 実走時の
      # 実測が lines 63.3% (Epic #397 のテスト整備 — read-only ゴールデン #444・
      # diff/sync #480・タイムアウト/キャンセル #481・introspection #493・SSH #331 —
      # により上昇)。CI の nextest と libtest で計測差はごく小さい (doctest なし) ため、
      # 実測−約 3pt の 60 を CI で確実に通る保守的なベースラインとする。下げないのが
      # 原則で、次の引き上げは更なるテスト整備で実測が上がってから行う。
      - name: Enforce coverage threshold
        working-directory: src-tauri
        run: cargo llvm-cov report --fail-under-lines 60

      # ジョブ所要時間・rust-cache ヒット・sccache ヒット率を Job Summary へ
      # 出力する (#565)。#417 の sccache stats (ログ出力) を Job Summary 可視化へ
      # 拡張し、バンドルサイズ (#443) / カバレッジ (#482) と同じく可視化のみで
      # fail はさせない。
      - name: Job timing & cache summary (#565)
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - NOOBDB_JOB_START ))
          {
            echo "### rust (coverage) 所要時間・キャッシュ"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| 所要時間 | ${ELAPSED} 秒 |"
            echo "| rust-cache (target) ヒット | ${{ steps.rust-cache.outputs.cache-hit }} |"
            echo ""
            echo '<details><summary>sccache --show-stats</summary>'
            echo ''
            echo '```'
            sccache --show-stats
            echo '```'
            echo ''
            echo '</details>'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  # Windows ターゲットの PR 事前検証 (#392)。Rust のコンパイル・テストは普段
  # Linux でしか走らず、Windows 固有の挙動 (keyring・ファイルパス・改行コード・
  # MSVC リンカ) のリグレッションは release.yml の main push まで検出できなかった。
  # ここで PR 段階で clippy + SQLite ユニット/統合テストを Windows 上で実行する。
  # Tauri の全スタックビルド (WebView2 等) は不要で、MSVC toolchain のみで足りる。
  # MySQL/PostgreSQL は接続 URL 環境変数を渡さないので統合テストはスキップされ、
  # SQLite 統合テスト (外部サービス不要) は常時実行される。
  #
  # clippy と nextest は単一ジョブで直列に実行する (#1872)。以前は Linux と同じ理由
  # (rust-clippy / rust-test の分割コメント参照) で 2 ジョブに分けていたが、
  # windows-latest は課金が Linux の 2 倍でコンパイルも最遅なうえ、2 ジョブは
  # rust-cache / sccache の鍵が別 (windows-clippy / windows-test) で成果物を共有せず、
  # 依存ツリーを 2 ランナーで二重にビルドしていた。1 ジョブにまとめると、ランナーの
  # 起動・セットアップ (Setup Rust / rust-cache / sccache 復元 / ツール導入、
  # 約 75 秒) とキャッシュの保存・復元が 1 回分になり、課金される計算量が減る。
  # 壁時計時間は max(clippy, test) から clippy + test に伸びる。なお cargo は
  # 依存ライブラリの check (rmeta) と codegen は共有されないので、2 本目のコマンドで
  # 再コンパイルがなくなるわけではない (sccache が効く範囲を除く)。一方 build script の
  # 実行結果と proc-macro は同じプロファイル (CARGO_PROFILE_DEV_DEBUG=0) なので共有される。
  # clippy を先に走らせるのは lint 違反を早く知らせるためだが、nextest ステップは
  # clippy が失敗しても実行する (テスト結果も同じ run で得る)。
  # 統合後は壁時計時間の伸びにより rust (windows) がクリティカルパスになりうる。
  # 必須チェック名は `rust (windows)` に変わる (旧 `rust (windows clippy)` /
  # `rust (windows test)` は消える)。必須チェックに設定している場合は更新すること
  # (現状 ruleset に必須チェックは無い)。
  rust-windows:
    name: rust (windows)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      # CI のテストビルドだけデバッグ情報を出さない。MSVC は統合テストのバイナリごとに
      # PDB を書き出すため、リンクの時間とキャッシュの容量が大きく減る。Cargo.toml の
      # `[profile.dev] debug = "line-tables-only"` はローカル開発用にそのまま残す
      # (Cargo の環境変数での上書き)。Windows で落ちたテストのバックトレースには
      # 行番号が出なくなるが、同じテストは Linux ジョブでも走り、そちらには残る。
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      # ジョブ全体の所要時間可視化 (#565) の起点。checkout より前に置き、
      # セットアップ込みの壁時計時間を測る。閾値 fail は設けない (可視化のみ)。
      # windows-latest の既定シェルは pwsh なので、他の GITHUB_ENV 書き込み
      # ステップと同様に明示的に bash を指定する。
      - name: Record job start time (#565)
        shell: bash
        run: echo "NOOBDB_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      # Defender のリアルタイム保護は、cargo / rustc が書く大量のファイルを 1 つずつ
      # スキャンして遅くする。ランナーは使い捨てなので止めてよい。checkout より前に置くのは、
      # checkout 自体の書き込みも速くするため。
      - name: Disable Defender real-time protection
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # RUSTC_WRAPPER=sccache を有効にしているため、rustc を呼ぶ後続ステップより
      # 前に sccache 本体を導入する。
      - name: Install sccache
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: sccache

      # Rust の単体 / 統合テストは __test_api 経由で db::Connection を駆動するだけで
      # webview も run() も起動せず、実フロント資産を必要としない。tauri::generate_context!
      # が参照する frontendDist (../dist) を満たすには dist/index.html が存在すれば足りる
      # ため、pnpm install + build の代わりに最小スタブを 1 枚生成する (#796)。実フロント
      # ビルドの検証は専用の frontend ジョブに一本化しており、Rust ジョブで再ビルドしても
      # カバレッジ上の意味はない。これにより 4 Rust ジョブ×(pnpm install + build) 分の時間・
      # キャッシュ I/O と pnpm 関連ステップ (setup-node / corepack / store キャッシュ) を
      # 削減する。
      - name: Stub frontend dist (for tauri::generate_context!)
        shell: bash
        run: mkdir -p dist && echo "" > dist/index.html

      # Windows では config.toml が MSVC リンカに lld-link を指定している。
      # windows-latest には LLVM がプリインストール済みで lld-link が PATH 上にある。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Cache cargo
        id: rust-cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: windows
          # Windows は保存 (post step の target 圧縮 + アップロード) が約 1 分かかる。
          # PR 実行で保存したキャッシュは他の PR から参照できないため、保存は main
          # の push だけに絞る (PR は main スコープのキャッシュを復元するだけ)。
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # sccache は復元だけをここで行い、保存は下の「Save sccache (main only)」で
      # main の push に限る (rust-cache の save-if と同じ理由)。
      - name: Cache sccache
        id: sccache-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ runner.os }}-windows-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-windows-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest

      # crates.io インデックス更新 (`Updating crates.io index`) を省く (#1680)。
      # 実測 (main の push, 2026-10-18 JST) で `cargo nextest run` の冒頭にこれが約 26 秒かかる。
      # rust-cache は ~/.cargo/registry を保存対象にしているが、sparse index (registry/index)
      # は復元されず、`cargo fetch --offline` が `no matching package named aes-gcm found`
      # で失敗することを PR #1721 の run で確認した (rust-cache が index キャッシュを掃除
      # するため)。そこで index だけを自前の actions/cache で持つ。ダウンロード済みクレート
      # (registry/cache) は rust-cache が復元する。保存は他の Windows キャッシュと同じく
      # main の push だけ (index は数 MB 程度で、保存コストは短縮分を食わない)。
      - name: Cache cargo registry index
        id: cargo-index-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry/index
          key: cargo-index-${{ runner.os }}-windows-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-index-${{ runner.os }}-windows-

      # index とクレートが全部そろっていれば `--offline` で足りる。足りないもの (Cargo.lock を
      # 変えた PR など) があると probe が失敗するので、オンラインのまま走る。失敗は握りつぶして
      # よい (オンラインへフォールバックするだけ)。probe は Windows ターゲットの依存だけを見る。
      - name: Use offline registry when fully cached (#1680)
        shell: bash
        working-directory: src-tauri
        run: |
          if cargo fetch --locked --offline --target x86_64-pc-windows-msvc; then
            echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
            echo "registry fully cached: running cargo offline"
          else
            echo "registry not fully cached: running cargo online"
          fi

      - name: cargo clippy
        id: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      # SQLite 統合テスト (tests/sqlite_integration.rs) は外部サービス不要で常時
      # 実行される (integration グループ)。
      # external グループ (MySQL/PostgreSQL/SSH/TLS) は NOOBDB_TEST_* の env ゲート
      # 付きで、このジョブは env を渡さないためほぼ 0 件実行になる (env 不要なのは
      # SSH 多段のエラー表示テスト 1 件だけ)。重いリンク (sqlx の mysql/postgres・
      # russh) を払うだけなので対象から外す (#1511)。external は env を渡す
      # `rust (test)` で全件実走する。Cargo.toml に [[test]] を足したら
      # ここにも --test を追加すること。
      # clippy が落ちてもテスト結果は得る (両コマンドを確実に実行する, #1872)。
      - name: cargo nextest run
        if: success() || steps.clippy.outcome == 'failure'
        working-directory: src-tauri
        run: cargo nextest run --locked --lib --test golden --test integration --test serde_schema_parity

      # cargo の index は main の push で、完全一致のキーが無かったときだけ保存する (#1680)。
      - name: Save cargo registry index (main only)
        if: success() && github.ref == 'refs/heads/main' && steps.cargo-index-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry/index
          key: cargo-index-${{ runner.os }}-windows-${{ hashFiles('src-tauri/Cargo.lock') }}

      # main の push のときだけ sccache を保存する。復元時に完全一致した場合は
      # 内容が変わらないので保存しない (従来の actions/cache と同じ挙動)。
      - name: Save sccache (main only)
        if: always() && github.ref == 'refs/heads/main' && steps.sccache-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ runner.os }}-windows-${{ hashFiles('src-tauri/Cargo.lock') }}

      # ジョブ所要時間・rust-cache ヒット・sccache ヒット率を Job Summary へ
      # 出力する (#565)。#417 の sccache stats (ログ出力) を Job Summary 可視化へ
      # 拡張し、バンドルサイズ (#443) / カバレッジ (#482) と同じく可視化のみで
      # fail はさせない。
      - name: Job timing & cache summary (#565)
        if: always()
        shell: bash
        run: |
          ELAPSED=$(( $(date +%s) - NOOBDB_JOB_START ))
          {
            echo "### rust (windows) 所要時間・キャッシュ"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| 所要時間 | ${ELAPSED} 秒 |"
            echo "| rust-cache (target) ヒット | ${{ steps.rust-cache.outputs.cache-hit }} |"
            echo ""
            echo '<details><summary>sccache --show-stats</summary>'
            echo ''
            echo '```'
            sccache --show-stats
            echo '```'
            echo ''
            echo '</details>'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
