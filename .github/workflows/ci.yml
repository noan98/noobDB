      # ビルドの検証は専用の frontend ジョブに一本化しており、Rust ジョブで再ビルドしても
      # カバレッジ上の意味はない。これにより 4 Rust ジョブ×(pnpm install + build) 分の時間・
      # キャッシュ I/O と pnpm 関連ステップ (setup-node / corepack / store キャッシュ) を
      # 削減する。
      - name: Stub frontend dist (for tauri::generate_context!)
        shell: bash
        run: mkdir -p dist && echo "" > dist/index.html

      # Windows では config.toml が MSVC リンカに lld-link を指定している。
      # windows-latest には LLVM がプリインストール済みで lld-link が PATH 上にある。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
