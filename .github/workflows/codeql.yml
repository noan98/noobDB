name: codeql

on:
  pull_request:
    branches: [main]
  schedule:
    # 毎週月曜 JST 09:00 (UTC 00:00) に定期スキャン
    - cron: "0 0 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # 変更されたパスを見て解析ジョブを出し分ける (ci.yml と同じ方式)。CodeQL は
  # JS/TS と Rust を解析するため、どちらにも関係しないドキュメントだけの PR などで
  # 走らせても結果は変わらない。言語ごとに変更領域を判定し、該当言語の解析だけを回す。ワークフロー単位の paths: で丸ごとスキップすると必須チェック設定時に
  # 「待機中」で固まるため、ジョブ単位の if: でゲートする (スキップは必須チェックを
  # 満たす)。週次の schedule 実行は常にフル解析する。
  changes:
    name: detect changed areas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # ハング時にデフォルト 6 時間ランナーを占有し続けるのを防ぐ (正常時は影響なし)。
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # CodeQL の JS 抽出器はリポジトリ全体の .js/.mjs/.ts/.tsx を対象にする
          # ため、src/ だけでなく scripts/ (bundle-size.mjs 等) も監視する。
          filters: |
            js:
              - 'src/**'
              - 'index.html'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'vite.config.ts'
              - 'vitest.browser.config.ts'
              - '.github/workflows/codeql.yml'
            # Rust は build-mode: none でソースと Cargo マニフェストから抽出する。
            # フロントのみの PR では解析を回さない (Rust 解析は JS/TS より重いため)。
            rust:
              - 'src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/codeql.yml'

  analyze:
    name: CodeQL (${{ matrix.language }})
    needs: changes
    # schedule (週次) は常に実行。PR では言語ごとに関連パスに変更があるときだけ実行する
    # (JS/TS は js、Rust は rust フィルタ)。matrix のジョブ単位でスキップされるので、
    # 例えば Rust だけの PR では JS/TS の解析は走らない。
    # changes ジョブは schedule ではスキップされるため、!cancelled() で「依存ジョブが
    # スキップでも評価する」ようにしている。
    if: >-
      !cancelled() && (
        github.event_name == 'schedule' ||
        (matrix.language == 'javascript-typescript' && needs.changes.outputs.js == 'true') ||
        (matrix.language == 'rust' && needs.changes.outputs.rust == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript は JS/TS ソースを対象にするビルトイン言語名。
        # rust は build-mode: none (ビルド不要。cargo build や Tauri のシステム依存の
        # 導入は要らない) で解析する。結果は Security タブに出るだけで、解析ジョブは
        # 必須チェックに含めない (可視化から入る運用。#1588)。
        language: ["javascript-typescript", "rust"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          # Rust は build-mode: none のみサポート (Autobuild ステップも飛ばす)。
          # JS/TS は従来どおり未指定 (Autobuild) のまま。
          build-mode: ${{ matrix.language == 'rust' && 'none' || '' }}
          # ノイズの多いルールを抑制してシグナル重視のベースラインから運用開始する。
          # 追加のカスタムクエリは queries: フィールドで指定できる。
          queries: security-extended

      # JS/TS は autobuild で対応できる (Rust は build-mode: none のため対象外) (ビルド成果物に依存しないため)。
      # init / autobuild / analyze は同一バージョンに揃える必要がある (init が書いた
      # 設定を後続ステップが読むため)。一部のステップだけバージョンが上がると
      # 「Loaded a configuration file for version 'X', but running version 'Y'」の
      # 設定エラーになる。この事故は v4.37.0 (init のみ)・v4.37.1 (analyze のみ)・
      # v4.37.3 (analyze のみ)・v4.37.4 (init のみ) で繰り返し発生しており、その都度
      # 3 ステップを同一バージョンへ揃えて復旧している。
      # (現在の版は Initialize CodeQL の `uses:` の SHA とコメントを参照)
      # **codeql-action は単一リポジトリなので、init / autobuild / analyze は同じ
      # コミット SHA を指す**のが正しい状態。バージョンを上げるときは必ず 3 箇所
      # 同時に更新すること。Dependabot が 1 箇所ずつ別 PR を出して事故が再発するのを
      # 防ぐため、`.github/dependabot.yml` の `codeql-action` グループで
      # `github/codeql-action*` の更新を 1 本の PR にまとめている。
      - name: Autobuild
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
