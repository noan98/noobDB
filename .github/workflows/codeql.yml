name: codeql

on:
  pull_request:
    branches: [main]
  schedule:
    # 毎週月曜 JST 09:00 (UTC 00:00) に定期スキャン
    - cron: "0 0 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # 変更されたパスを見て解析ジョブを出し分ける (ci.yml と同じ方式)。CodeQL は
  # JS/TS のみを解析するため、Rust やドキュメントだけの PR で走らせても結果は
  # 変わらない。ワークフロー単位の paths: で丸ごとスキップすると必須チェック設定時に
  # 「待機中」で固まるため、ジョブ単位の if: でゲートする (スキップは必須チェックを
  # 満たす)。週次の schedule 実行は常にフル解析する。
  changes:
    name: detect changed areas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # ハング時にデフォルト 6 時間ランナーを占有し続けるのを防ぐ (正常時は影響なし)。
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js }}
    steps:
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          # CodeQL の JS 抽出器はリポジトリ全体の .js/.mjs/.ts/.tsx を対象にする
          # ため、src/ だけでなく scripts/ (bundle-size.mjs 等) も監視する。
          filters: |
            js:
              - 'src/**'
              - 'index.html'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'vite.config.ts'
              - 'vitest.browser.config.ts'
              - '.github/workflows/codeql.yml'

  analyze:
    name: CodeQL (${{ matrix.language }})
    needs: changes
    # schedule (週次) は常に実行。PR では JS/TS 関連パスに変更があるときだけ実行する。
    # changes ジョブは schedule ではスキップされるため、!cancelled() で「依存ジョブが
    # スキップでも評価する」ようにしている。
    if: >-
      !cancelled() && (
        github.event_name == 'schedule' ||
        needs.changes.outputs.js == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript は JS/TS ソースを対象にするビルトイン言語名。
        # Rust は CodeQL の実験的サポートであり、成熟度が低くノイズが多いため
        # 当面は JS/TS のみでシグナルを安定させる。
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}
          # ノイズの多いルールを抑制してシグナル重視のベースラインから運用開始する。
          # 追加のカスタムクエリは queries: フィールドで指定できる。
          queries: security-extended

      # JS/TS は autobuild で対応できる (ビルド成果物に依存しないため)。
      # init / autobuild / analyze は同一バージョンに揃える必要がある (init が書いた
      # 設定を後続ステップが読むため)。一部のステップだけバージョンが上がると
      # 「Loaded a configuration file for version 'X', but running version 'Y'」の
      # 設定エラーになる。この事故は v4.37.0 (init のみ)・v4.37.1 (analyze のみ)・
      # v4.37.3 (analyze のみ)・v4.37.4 (init のみ) で繰り返し発生しており、その都度
      # 3 ステップを同一バージョンへ揃えて復旧している (現在は v4.37.4)。
      # **codeql-action は単一リポジトリなので、init / autobuild / analyze は同じ
      # コミット SHA を指す**のが正しい状態。バージョンを上げるときは必ず 3 箇所
      # 同時に更新すること。Dependabot が 1 箇所ずつ別 PR を出して事故が再発するのを
      # 防ぐため、`.github/dependabot.yml` の `codeql-action` グループで
      # `github/codeql-action*` の更新を 1 本の PR にまとめている。
      - name: Autobuild
        uses: github/codeql-action/autobuild@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          category: "/language:${{ matrix.language }}"
