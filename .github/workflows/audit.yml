name: audit

# フロントエンド依存 (pnpm) の定期脆弱性監査 (#605)。
#
# 位置づけ: 依存関係の脆弱性チェックは Rust 側で cargo-deny (RustSec Advisory DB、
# ci.yml の rust (deny) ジョブ) が既に PR ごとに実走しているが、フロントエンド側
# (pnpm) には対になる仕組みが無かった。本ワークフローがその可視化を担う。
#
# 役割分担 (CLAUDE.md にも記載):
#   - Dependabot (.github/dependabot.yml)  … 更新 PR の自動生成 (グルーピング/週次)
#   - cargo-deny (ci.yml の rust (deny))   … Rust 依存のライセンス許可リスト + 脆弱性ゲート
#   - pnpm audit (このワークフロー)         … フロント依存の脆弱性可視化
#
# PR ごとに実走させると新規脆弱性の検出が翌 PR まで遅延しないメリットはあるが、
# 依存を追加/更新していない PR でも毎回外部 DB (npm advisory) に問い合わせることになり
# 無駄が大きい。バンドルサイズ (#443) ・カバレッジ (#482) と同じ漸進方針で、まずは
# 週次スケジュール + 手動トリガの可視化のみとし、**fail させない**。
on:
  schedule:
    # 毎週月曜 03:00 UTC (JST 月曜 12:00) に実行。
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# 手動トリガの連続起動や schedule との重複で同時実行しないようにする。
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

# corepack が pnpm を取得する際の対話プロンプトを無効化 (CI は非対話)。
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  pnpm-audit:
    name: pnpm audit (frontend 依存脆弱性)
    runs-on: ubuntu-latest
    # ハング時にデフォルト 6 時間ランナーを占有し続けるのを防ぐ (正常時は影響なし)。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Get pnpm store directory
        shell: bash
        run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 当面は閾値による fail を設けず可視化のみ (バンドルサイズ #443・カバレッジ
      # #482 と同じ漸進方針)。ただし `|| true` で握りつぶさず終了コードを step output
      # (exit_code) に残し、後続の notify ジョブ (#1395) が検出有無を拾ってトラッキング
      # Issue を upsert する。本ステップ自体は常に成功 (ブロックしない)。
      - name: pnpm audit (可視化のみ)
        id: audit
        shell: bash
        run: |
          set +e
          pnpm audit > audit-output.txt 2>&1
          code=$?
          set -e
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          {
            echo '### pnpm audit (フロントエンド依存脆弱性)'
            echo ''
            echo '```'
            cat audit-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # notify ジョブへ渡す要約 (Issue 本文の肥大を避けて先頭 80 行に切る)。
          {
            echo "summary<<AUDIT_EOF_$$"
            head -n 80 audit-output.txt
            echo "AUDIT_EOF_$$"
          } >> "$GITHUB_OUTPUT"
    outputs:
      exit_code: ${{ steps.audit.outputs.exit_code }}
      summary: ${{ steps.audit.outputs.summary }}

  # 検出結果の通知 (#1395)。見に行かなければ腐る Job Summary だけの導線を補うため、
  # 脆弱性が検出されたらトラッキング Issue (ラベル ci:audit) を upsert し、検出 0 件に
  # 戻ったら自動でクローズする。`issues: write` はこのジョブにだけ付与し、本体ジョブの
  # 権限は増やさない。schedule / workflow_dispatch でのみ起動する (本ワークフローは
  # PR では走らないが、将来トリガが増えても通知しないようガードする)。
  notify:
    name: 検出結果の通知 (トラッキング Issue)
    needs: pnpm-audit
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.pnpm-audit.result != 'cancelled' && needs.pnpm-audit.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/upsert-tracking-issue.sh
          sparse-checkout-cone-mode: false

      - name: トラッキング Issue を upsert
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RESULT: ${{ needs.pnpm-audit.result }}
          AUDIT_EXIT: ${{ needs.pnpm-audit.outputs.exit_code }}
          AUDIT_SUMMARY: ${{ needs.pnpm-audit.outputs.summary }}
          TRACK_LABEL: ci:audit
          # 依存の脆弱性対応は日常運用で効くが数時間で済むことが多い。
          TRACK_EXTRA_LABELS: cost:Low,benefit:3
        run: |
          if [ "$AUDIT_RESULT" = "success" ] && [ "$AUDIT_EXIT" = "0" ]; then
            TRACK_STATE=ok bash scripts/upsert-tracking-issue.sh
          else
            {
              echo "週次の \`pnpm audit\` でフロントエンド依存の脆弱性が検出された (または audit の実行自体が失敗した) ため自動作成されたトラッキング Issue です。"
              echo ""
              echo "- ジョブ結果: \`${AUDIT_RESULT}\` / \`pnpm audit\` 終了コード: \`${AUDIT_EXIT:-不明}\`"
              echo ""
              echo '```'
              printf '%s\n' "$AUDIT_SUMMARY"
              echo '```'
              echo ""
              echo "対応方針: Dependabot の更新 PR を確認するか、\`pnpm update\` / \`pnpm.overrides\` で解消してください。検出 0 件に戻ると次回の週次実行で自動クローズされます。"
            } > issue-body.md
            TRACK_STATE=problem \
              TRACK_TITLE="[audit] pnpm audit でフロントエンド依存の脆弱性を検出" \
              TRACK_BODY_FILE=issue-body.md \
              TRACK_DEDUP_KEY="exit=${AUDIT_EXIT};sha=$(printf '%s' "$AUDIT_SUMMARY" | sha256sum | cut -c1-12)" \
              bash scripts/upsert-tracking-issue.sh
          fi
