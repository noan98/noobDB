name: audit

# フロントエンド依存 (pnpm) の定期脆弱性監査 (#605)。
#
# 位置づけ: 依存関係の脆弱性チェックは Rust 側で cargo-deny (RustSec Advisory DB、
# ci.yml の rust (deny) ジョブ) が既に PR ごとに実走しているが、フロントエンド側
# (pnpm) には対になる仕組みが無かった。本ワークフローがその可視化を担う。
#
# 役割分担 (CLAUDE.md にも記載):
#   - Dependabot (.github/dependabot.yml)  … 更新 PR の自動生成 (グルーピング/週次)
#   - cargo-deny (ci.yml の rust (deny))   … Rust 依存のライセンス許可リスト + 脆弱性ゲート
#   - pnpm audit (このワークフロー)         … フロント依存の脆弱性可視化
#
# PR ごとに実走させると新規脆弱性の検出が翌 PR まで遅延しないメリットはあるが、
# 依存を追加/更新していない PR でも毎回外部 DB (npm advisory) に問い合わせることになり
# 無駄が大きい。バンドルサイズ (#443) ・カバレッジ (#482) と同じ漸進方針で、まずは
# 週次スケジュール + 手動トリガの可視化のみとし、**fail させない**。
on:
  schedule:
    # 毎週月曜 03:00 UTC (JST 月曜 12:00) に実行。
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# 手動トリガの連続起動や schedule との重複で同時実行しないようにする。
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

# corepack が pnpm を取得する際の対話プロンプトを無効化 (CI は非対話)。
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  pnpm-audit:
    name: pnpm audit (frontend 依存脆弱性)
    runs-on: ubuntu-latest
    # ハング時にデフォルト 6 時間ランナーを占有し続けるのを防ぐ (正常時は影響なし)。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Get pnpm store directory
        shell: bash
        run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 当面は閾値による fail を設けず可視化のみ (バンドルサイズ #443・カバレッジ
      # #482 と同じ漸進方針)。`|| true` で握りつぶさず、`pnpm audit --json` の
      # metadata.vulnerabilities の合計で検出有無を判定して step output (status) に残し、
      # 後続の notify ジョブ (#1395) がトラッキング Issue を upsert / close する。
      #   status=clean … 検出 0 件 / found … 1 件以上 / error … JSON が取れず判定不能
      # 本ステップ自体は常に成功する (ブロックしない)。
      - name: pnpm audit (可視化のみ)
        id: audit
        shell: bash
        run: |
          set +e
          pnpm audit --json > audit.json 2> audit-err.txt
          json_code=$?
          # 人間向けの要約用に通常出力でもう一度実行する (終了コードは使わない)。
          pnpm audit > audit-output.txt 2>&1
          set -e
          status=$(python3 - << 'PYEOF'
          import json, pathlib
          try:
              data = json.loads(pathlib.Path("audit.json").read_text())
              vulns = data["metadata"]["vulnerabilities"]
              total = sum(int(v) for v in vulns.values())
              print("found" if total > 0 else "clean")
          except Exception:
              print("error")
          PYEOF
          )
          {
            echo "status=${status}"
            echo "exit_code=${json_code}"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### pnpm audit (フロントエンド依存脆弱性)'
            echo ''
            echo "判定: \`${status}\` (\`pnpm audit --json\` 終了コード: ${json_code})"
            echo ''
            echo '```'
            cat audit-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # notify ジョブへ渡す要約 (Issue 本文の肥大を避けて先頭 80 行に切る)。
          # 区切りはランダム値にし、出力中に偶然現れても途中で切れないようにする。
          delim="AUDIT_EOF_$(openssl rand -hex 16)"
          {
            echo "summary<<${delim}"
            head -n 80 audit-output.txt
            echo ""
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"
    outputs:
      status: ${{ steps.audit.outputs.status }}
      exit_code: ${{ steps.audit.outputs.exit_code }}
      summary: ${{ steps.audit.outputs.summary }}

  # 検出結果の通知 (#1395)。見に行かなければ腐る Job Summary だけの導線を補うため、
  # 脆弱性が検出されたらトラッキング Issue (ラベル ci:audit) を upsert し、検出 0 件に
  # 戻ったら自動でクローズする。`issues: write` はこのジョブにだけ付与し、本体ジョブの
  # 権限は増やさない。schedule / workflow_dispatch でのみ起動する (本ワークフローは
  # PR では走らないが、将来トリガが増えても通知しないようガードする)。既定ブランチ以外の
  # workflow_dispatch では Issue を open / close しない。
  notify:
    name: 検出結果の通知 (トラッキング Issue)
    needs: pnpm-audit
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (needs.pnpm-audit.result == 'success' || needs.pnpm-audit.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/upsert-tracking-issue.sh
          sparse-checkout-cone-mode: false

      - name: トラッキング Issue を upsert
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RESULT: ${{ needs.pnpm-audit.result }}
          AUDIT_STATUS: ${{ needs.pnpm-audit.outputs.status }}
          AUDIT_EXIT: ${{ needs.pnpm-audit.outputs.exit_code }}
          AUDIT_SUMMARY: ${{ needs.pnpm-audit.outputs.summary }}
          TRACK_LABEL: ci:audit
          # 依存の脆弱性対応は日常運用で効くが数時間で済むことが多い。
          TRACK_EXTRA_LABELS: cost:Low,benefit:3
        run: |
          if [ "$AUDIT_RESULT" = "success" ] && [ "$AUDIT_STATUS" = "clean" ]; then
            TRACK_STATE=ok bash scripts/upsert-tracking-issue.sh
            exit 0
          fi
          if [ "$AUDIT_RESULT" = "success" ] && [ "$AUDIT_STATUS" = "found" ]; then
            title="[audit] pnpm audit でフロントエンド依存の脆弱性を検出"
            intro="週次の \`pnpm audit\` でフロントエンド依存の脆弱性が検出されたため自動作成されたトラッキング Issue です。"
            tail_msg="対応方針: Dependabot の更新 PR を確認するか、\`pnpm update\` / \`pnpm.overrides\` で解消してください。検出 0 件に戻ると次回の週次実行で自動クローズされます。"
            key="found;sha=$(printf '%s' "$AUDIT_SUMMARY" | sha256sum | cut -c1-12)"
          else
            # 判定不能 (JSON が取れない / ジョブ失敗)。脆弱性の有無は不明なので Issue は
            # クローズせず、検出とは別タイトル・別キーで失敗として通知する。
            title="[audit] pnpm audit の実行に失敗しました (判定不能)"
            intro="週次の \`pnpm audit\` の結果を判定できなかった (レジストリ到達不能など) ため自動作成されたトラッキング Issue です。脆弱性の有無は不明です。"
            tail_msg="実行ページのログを確認してください。次回の実行で検出 0 件と判定されると自動クローズされます。"
            key="error;result=${AUDIT_RESULT};exit=${AUDIT_EXIT:-unknown}"
          fi
          {
            echo "$intro"
            echo ""
            echo "- ジョブ結果: \`${AUDIT_RESULT}\` / 判定: \`${AUDIT_STATUS:-不明}\` / \`pnpm audit --json\` 終了コード: \`${AUDIT_EXIT:-不明}\`"
            echo ""
            # 出力中にバッククォート 3 連が含まれても崩れないよう ~~~~ で囲む。
            echo '~~~~'
            printf '%s\n' "$AUDIT_SUMMARY"
            echo '~~~~'
            echo ""
            echo "$tail_msg"
          } > issue-body.md
          TRACK_STATE=problem \
            TRACK_TITLE="$title" \
            TRACK_BODY_FILE=issue-body.md \
            TRACK_DEDUP_KEY="$key" \
            bash scripts/upsert-tracking-issue.sh
