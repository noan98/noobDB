# ──────────────────────────────────────────────────────────────────────────────
# noobDB E2E テスト (tauri-driver + WebDriverIO / #529 PoC → #1245 nightly 昇格)
#
# 【位置づけ】
# tauri-driver による実 webview (WebKitGTK) E2E を、毎晩 (UTC 18:00 = JST 03:00)
# 自動実行する nightly ワークフロー。`workflow_dispatch` による手動実行も残している。
# CI の必須チェック (Required status checks) には含めない (PR ゲートにもしない)。
# 失敗しても PR / マージはブロックされないので、翌朝 Actions の結果を確認して対処する。
#
# 必須チェックにしない理由:
#   1. Tauri バイナリのビルドに時間がかかり (クリーンビルド 10〜20 分)、PR ごとの
#      壁時計時間を大幅に延ばす。
#   2. WebKitWebDriver + xvfb の組み合わせは flaky になりやすく、マージを止める
#      false negative の運用負荷が大きい。
#
# 【昇格時点での状況 (#1245)】
#   - セレクタは data-testid ベースに安定化済み。
#   - IPC 固有のアサーション (実 SQLite のラウンドトリップ・ディスクへの永続化) を追加済み。
#   - 「3 回連続グリーン」「実行時間 15 分以内 (キャッシュ暖機後)」は未確認。
#     nightly の実績で確認する (詳細は .claude/skills/noobdb-testing/references/e2e.md)。
#
# 【ローカル実行手順】
#   cargo install tauri-driver --locked
#   sudo apt-get install -y webkit2gtk-driver xvfb   # Linux のみ
#   pnpm run build                                   # dist/ を生成
#   cargo build                                      # src-tauri/ 配下で実行
#   xvfb-run -a pnpm test:e2e                        # Linux ヘッドレス
#   pnpm test:e2e                                    # Linux (ディスプレイあり) / Windows
# ──────────────────────────────────────────────────────────────────────────────
name: E2E (tauri-driver / nightly)

on:
  # 毎晩 UTC 18:00 (JST 03:00)。デフォルトブランチ上でのみ schedule は発火する。
  schedule:
    - cron: "0 18 * * *"
  # 手動トリガ。対象ブランチを選択して実行できる。
  workflow_dispatch:
    inputs:
      debug:
        description: "デバッグログを有効化 (tauri-driver の詳細ログ)"
        required: false
        type: boolean
        default: false

# 手動実行と schedule の重複・連打で同時に走らせない (同一ブランチ内で後勝ち)。
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# corepack が pnpm を取得する際の対話プロンプトを無効化 (CI は非対話)。
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  e2e-linux:
    name: E2E / Linux (WebKitGTK)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      # ────────────────────────────────────────────────────────────────────
      # 1. チェックアウトと基本セットアップ
      # ────────────────────────────────────────────────────────────────────
      - name: コードをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js をセットアップ
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: pnpm を有効化
        run: corepack enable

      # ci.yml と同じ「pnpm store path の実体をキャッシュ」方式に揃える。
      # 以前の `~/.pnpm-store` は pnpm 10 の実ストアパスと一致せずほぼ空キャッシュ
      # だったうえ、ci.yml が温めた共有ストアキャッシュも再利用できなかった。
      - name: Get pnpm store directory
        shell: bash
        run: echo "PNPM_STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: pnpm ストアのキャッシュ
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # ────────────────────────────────────────────────────────────────────
      # 2. Rust と Tauri システム依存の導入
      # ────────────────────────────────────────────────────────────────────
      - name: Rust stable をセットアップ
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust キャッシュ (rust-cache)
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: "src-tauri -> target"
          key: e2e-linux

      # apt は 1 回の update + install にまとめる (起動回数を減らして短縮)。
      # webkit2gtk-driver / xvfb は E2E 実行時に必要 (tauri-driver が WebKitWebDriver を呼ぶ)。
      - name: linker ツール・Tauri システム依存・WebDriver をインストール
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang mold \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            webkit2gtk-driver \
            xvfb

      # ────────────────────────────────────────────────────────────────────
      # 3. tauri-driver をインストール (バイナリをキャッシュして毎回のビルドを避ける)
      # ────────────────────────────────────────────────────────────────────
      # tauri-driver は taiki-e/install-action の対応ツールではないため、
      # `cargo install` の成果物 (~/.cargo/bin/tauri-driver) を actions/cache で保持する。
      # キャッシュ miss のときだけビルドする。tauri-driver を更新したいときは
      # キーの `v1` を上げる。
      - name: tauri-driver のキャッシュ
        id: tauri-driver-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}-v1

      - name: tauri-driver をインストール
        if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked

      - name: cargo bin を PATH に追加 (tauri-driver 検出用)
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # ────────────────────────────────────────────────────────────────────
      # 4. フロントエンドビルド + Tauri デバッグバイナリのビルド
      # ────────────────────────────────────────────────────────────────────
      - name: フロントエンドをビルド (dist/ 生成)
        run: pnpm run build

      - name: Tauri デバッグバイナリをビルド
        run: cargo build
        working-directory: src-tauri

      # ────────────────────────────────────────────────────────────────────
      # 5. E2E テスト実行 (xvfb-run でヘッドレス)
      # ────────────────────────────────────────────────────────────────────
      - name: E2E テスト実行 (xvfb-run)
        # tauri-driver は PATH 上の tauri-driver バイナリを自動検出する。
        # cargo bin (~/.cargo/bin) は上の専用ステップで $GITHUB_PATH に追加済み。
        # ここで env.PATH を上書きしないこと: GitHub Actions の env 値はシェル展開
        # されないため `$HOME`/`$PATH` がリテラル文字列になり、ランナー本来の PATH
        # (xvfb-run のある /usr/bin など) を破壊して command not found を招く。
        run: |
          export WDIO_LOG_LEVEL=${{ github.event.inputs.debug == 'true' && 'trace' || 'info' }}
          xvfb-run -a --server-args="-screen 0 1280x800x24" pnpm test:e2e

      # ────────────────────────────────────────────────────────────────────
      # 6. アーティファクト保存 (失敗時のみ)
      # ────────────────────────────────────────────────────────────────────
      - name: テスト失敗時にスクリーンショットを保存
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots-${{ github.run_id }}
          path: |
            e2e/screenshots/
            e2e/logs/
          retention-days: 7
