name: automerge

# CI が成功し、Codex のレビューが完了して未解決のレビュースレッドが無い open PR を
# 自動で main へマージする。
# noobGit リポジトリの automerge ワークフローを参考に、noobDB 向けに移植したもの。
#
# 設計方針:
#   - PR のコードはチェックアウトせず `gh` CLI / GitHub API のみで完結させる
#     (フォークからの PR でも PR 由来のコードを実行しないため安全)。
#   - ブランチ保護に依存しない。CI の成功 (ci.yml の最新 run が success) を
#     自前で再確認し、mergeable / mergeStateStatus を見てからマージする。
#   - 人間のレビュー承認は要求しない。レビュー層はレビュー bot が担い、次の 2 段で
#     判定する:
#       (1) Codex (`chatgpt-codex-connector[bot]`) が **現在の head SHA を**
#           レビュー済みであること (Step 5)
#       (2) 未解決のレビュースレッドが 0 件であること (Step 6)
#     レビューが 1 件も付かない PR を素通しにはしない (Step 5 が止める)。
#
# レビュー基盤の CodeRabbit → Codex 移行 (#1109):
#   以前のレビュー層は CodeRabbit だったが、レートリミットが厳しく実用に耐えな
#   かったため GitHub App をアンインストールし、Codex へ移行した。CodeRabbit 専用の
#   `coderabbit-request-review.yml` / `coderabbit-fallback-approve.yml` は削除済みで、
#   本ファイルからも CodeRabbit 依存を撤去した。CodeRabbit が過去に出した指摘が
#   未解決スレッドとして残っている場合は、投稿者を問わない Step 6 が拾う。
#   先行して同じ移行を済ませた VeloX リポジトリの `auto-merge.yml` /
#   `check_review_gate.py` を参照して判定方式を揃えている。
#
# Codex の実測挙動 (#1099〜#1106 と VeloX での観測。ここが判定方式の根拠):
#   a. 指摘があるとき: `state: COMMENTED` のレビューを提出し、`commit_id` に
#      レビュー対象の head SHA が入る (PR #1099 で `94ffecb29779...` を確認)。
#      レビュー本文にも `**Reviewed commit:** \`94ffecb297\`` という定型行が入る。
#   b. **指摘が無いとき: レビューを提出せず、PR 本体に 👍 リアクションだけを付ける。**
#      Codex 自身の案内文 "If Codex has suggestions, it will comment; otherwise it
#      will react with 👍." のとおりで、VeloX の PR #191 (0 バイトのファイル追加のみ)
#      で実測済み。**付く場所は PR 本体への issue reaction** (`THUMBS_UP`)。
#      → これを完了信号に含めないと、クリーンな PR が永久にマージされない。
#   c. 利用上限に達したとき: issue comment で
#      `You have reached your Codex usage limits for code reviews.` を投稿し、
#      レビューは 1 件も提出しない (#1101 / #1105 / #1106 で確認)。
#   d. **push では再レビューしない。** 起動条件は「PR を open する」「draft を
#      ready にする」「`@codex review` とコメントする」の 3 つだけで push は
#      含まれない。つまり指摘に対応して push しただけでは head SHA は永遠に
#      未レビューのままになる → Step 5 が `@codex review` を自動投稿して補う。
#
# Step 5 の判定方式と、そう決めた理由:
#   - **「現在の head SHA に対する Codex の完了信号」を待つ。** サマリコメント等の
#     進行中マーカーだけで判定すると、マーカーが消えてから実レビューが提出される
#     までの窓で「未解決スレッド 0 件」も同時に成立し、指摘が届く前にマージできて
#     しまう (CodeRabbit 時代の PR #277 の取りこぼし)。Codex に置き換えても同じ穴を
#     開けないよう、確定信号は上記 a / b の 3 つの OR とする:
#       (a-1) Codex のレビューの `commit_id` が head SHA と完全一致
#       (a-2) レビュー本文の `Reviewed commit: <短縮SHA>` が head SHA と前方一致
#       (b)   Codex の 👍 リアクションが **head の push 観測時刻以降**に付いている
#     「Codex のレビューが存在する」だけでは不十分で、古いコミットへのレビューが
#     残っているだけのケースを (a-1)/(a-2) で弾く必要がある。
#   - **`push 観測時刻` に git の committer date を使わない。** committer date は
#     「commit をローカルで作った時刻」であり push 時刻ではない。cherry-pick や
#     rebase で容易に過去の日時になるため、(b) の 👍 が古い head 向けのものでも
#     「レビュー済み」と誤判定できてしまう。GitHub がサーバ側で観測した時刻として
#     head SHA の check-suite の作成時刻 (最小値) を使い、取れなければ安全側で
#     スキップする (committer date へのフォールバックは同じ穴を再現するので禁止)。
#   - **利用上限 (c) に達している場合は緩和して通す。** 待っても状況が変わらず、
#     何もしないと PR が永久に停止する。ただし黙っては通さず ::warning:: と
#     Job Summary で「レビューゲートが素通りした」ことを可視化する — CodeRabbit の
#     恒久 skip に対して #1055 で採った扱いと同じ方針。
#   - **head が未レビューのまま一定時間 (CODEX_REREVIEW_DELAY_MINUTES) 経ったら
#     `@codex review` を 1 回だけ自動投稿する** (上記 d への対処)。head SHA を
#     埋めたマーカー `<!-- automerge:codex-review-request:<sha> -->` で重複投稿を
#     防ぐ。**投稿できなかったときはマーカーを一切残さないこと** — マーカーだけが
#     残ると、その head SHA には二度と依頼が飛ばず永久に停止する。
#     投稿には Secrets `CODEX_PAT` (人間ユーザの PAT) が必要。GITHUB_TOKEN
#     (= github-actions[bot]) 由来のコマンドコメントにレビュー bot が反応しない
#     ことは CodeRabbit で実測済み (PR #1059) で、VeloX でも `@codex review` に
#     ついて同じ結果 (PR #200) が出ている。
#   - **それでも head が未レビューなら「マージしない」で止める。** 失敗側の安全性で
#     選ぶ方針 (「レビューなしでマージする」より「マージしない」を選ぶ)。ただし
#     Codex 側の障害・文言変更で全 PR が永久停止しないよう、逃げ道を 2 つ用意する:
#       - 過去に利用上限メッセージが 1 度でも観測されていれば緩和して通す (警告付き)
#       - `automerge-without-codex` ラベルで Codex 要件だけを免除する (警告付き)
#     どちらも **Step 6 の未解決スレッド判定は免除しない** (人間 / bot の明示的な
#     指摘を尊重するため)。
#
# 既知の残課題:
#   - 通常コメント (issue comment) での「修正してから merge」は Step 6 の
#     未解決スレッド判定では拾えない (#1108)。本ファイルの同じゲート設計を触る
#     ため、#1109 (本移行) とは分けて対応する。
#
# トリガ:
#   - ci ワークフローが完了したとき (workflow_run) — CI 成功を起点に再評価する。
#   - レビューが提出されたとき (pull_request_review) — Codex のレビュー提出 /
#     スレッド解消を起点に再評価。
#   - PR にコメントが付いたとき (issue_comment) — Codex の利用上限メッセージや
#     `@codex review` への応答を起点に再評価する (Codex はレビューを出さずに
#     コメントだけを返す経路があるため、これが無いと取りこぼす)。
#
# なお **Codex の 👍 リアクションはイベントを生まない**ため、それだけを待って
# 再評価する経路は無い。実運用では CI (数十分) の完了が Codex の応答 (数分) より
# 遅いため workflow_run で拾えるが、取りこぼした場合は PR に何かコメントすれば
# 再評価される (下の `if` が OWNER / MEMBER / COLLABORATOR のコメントを通すのは
# この再評価の手段も兼ねている)。

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [ci]
    types: [completed]

# 同一コミット (head SHA) に対する重複マージ試行を直列化する。イベント種別が
# 違っても同じ SHA を指す run はまとめ、レースを避ける (途中 run はキャンセルしない)。
# issue_comment には head SHA が無いため PR (issue) 番号でグルーピングする。
concurrency:
  group: automerge-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.event.issue.number }}
  cancel-in-progress: false

# GITHUB_TOKEN に必要な書き込み権限。リポジトリの Actions 設定で
# 「Read and write permissions」が有効でないとマージできない点に注意。
# `checks: read` は head SHA の push 観測時刻 (check-suite の作成時刻) を
# 取得するために必要 (Step 5)。
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

env:
  # Codex アプリのログイン名。**完全一致で照合する** —
  # `chatgpt-codex-connector-review` のような別名アカウントが前方一致で
  # すり抜けないようにするため (VeloX の PR #192 の指摘と同じ穴を作らない)。
  CODEX_LOGIN: chatgpt-codex-connector[bot]
  # head SHA の push 観測時刻からこの分数が経過しても Codex の完了信号が
  # 無ければ `@codex review` を 1 回だけ自動投稿する。Codex は PR の open /
  # draft → ready では自動レビューするので、それが飛んでくるまでの待ち時間。
  # 実測では数分以内に応答するため 5 分。短すぎると自動レビューと依頼が
  # 二重に走り、長すぎると修正 push 後の停止時間が伸びる。
  CODEX_REREVIEW_DELAY_MINUTES: 5
  # このラベルが付いた PR は **Codex のレビュー要件だけを** 免除する
  # (Step 6 の未解決スレッド判定は免除しない)。Codex 側の障害・クォータ切れ・
  # 応答文言の変更で全 PR が永久停止しないための最終手段の保険。
  CODEX_BYPASS_LABEL: automerge-without-codex

jobs:
  automerge:
    name: auto-merge eligible PRs
    runs-on: ubuntu-latest
    # 外部 API 待ち (mergeable 判定リトライ・指数バックオフ) が積み上がっても
    # ランナーを占有し続けないよう上限を付ける (正常時は影響なし)。
    timeout-minutes: 10
    # CI 成功 (pull_request 由来) / レビュー提出 / PR へのコメントのときだけ走らせる。
    #
    # **投稿者を絞る理由**: 本リポジトリは public なので、レビューもコメントも
    # GitHub の任意のユーザが投稿できる。`contents: write` とマージ権限を持つ
    # ジョブを誰でも起動できる状態にはしない。通すのは
    #   - `author_association` が OWNER / MEMBER / COLLABORATOR、または
    #   - ログイン名が Codex bot と完全一致
    # のいずれかを満たす場合のみ。bot のログイン名は `[` `]` を含み GitHub の
    # ユーザ名として作成できないため、一般ユーザが一致を偽装することはできない
    # (bot の `author_association` は NONE / CONTRIBUTOR になりうるので、
    # ログイン名の一致を別に見る必要がある)。
    #
    # なお **このジョブはコメント本文やレビュー本文を判定に一切使わない**。
    # 起動後は PR を API から取り直し、CI・Codex の完了信号・レビュースレッドを
    # 一から評価する。したがってコメントでできるのは「判定をやり直させる」ことだけで、
    # 判定結果を変えることはできない。上の絞り込みは多層防御 + 空振り実行の削減。
    #
    # 自分が投稿した `@codex review` 依頼コメント (マーカー入り) では起動しない
    # (判定材料が増えていないので空振りするだけ)。
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request_review' &&
       (contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association) ||
        github.event.review.user.login == 'chatgpt-codex-connector[bot]')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       !contains(github.event.comment.body, '<!-- automerge:') &&
       (contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) ||
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]'))
    steps:
      - name: Check conditions and auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          ISSUE_PR: ${{ github.event.issue.number }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          # `@codex review` の自動投稿専用の PAT (人間ユーザのもの)。**未設定なら
          # 投稿しない。** GITHUB_TOKEN (= github-actions[bot]) で投稿しても
          # レビュー bot は反応しないため、空打ちして「依頼が届いた」と誤認させる
          # より投稿しない方が安全側 (CodeRabbit の PR #1059 / VeloX の PR #200)。
          CODEX_PAT: ${{ secrets.CODEX_PAT }}
        run: |
          set -euo pipefail

          owner="${GH_REPO%/*}"
          repo="${GH_REPO#*/}"

          # 1. 対象 PR 番号を解決する。
          if [ "$EVENT_NAME" = "pull_request_review" ]; then
            PR="$REVIEW_PR"
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            PR="$ISSUE_PR"
          else
            # workflow_run: head_sha からその commit に紐づく open PR を引く。
            PR="$(gh api "repos/$GH_REPO/commits/$RUN_SHA/pulls" \
              --jq '[.[] | select(.state == "open")][0].number // empty')"
          fi

          if [ -z "${PR:-}" ]; then
            echo "対象の open PR が見つかりませんでした。スキップします。"
            exit 0
          fi
          echo "対象 PR: #$PR"

          # 2. PR メタデータを取得。mergeable は非同期計算で UNKNOWN になりうるので
          #    確定するまで最大 5 回 (3 秒間隔) リトライする。
          state=""; isDraft=""; baseRef=""; headSha=""; mergeable=""; meta=""
          for i in 1 2 3 4 5; do
            meta="$(gh pr view "$PR" --json state,isDraft,baseRefName,headRefOid,mergeable,labels)"
            state="$(echo "$meta" | jq -r '.state')"
            isDraft="$(echo "$meta" | jq -r '.isDraft')"
            baseRef="$(echo "$meta" | jq -r '.baseRefName')"
            headSha="$(echo "$meta" | jq -r '.headRefOid')"
            mergeable="$(echo "$meta" | jq -r '.mergeable')"
            if [ "$mergeable" != "UNKNOWN" ]; then
              break
            fi
            echo "mergeable が UNKNOWN。3 秒後に再取得 ($i/5)..."
            sleep 3
          done

          # 3. 状態の検証。
          if [ "$state" != "OPEN" ];        then echo "PR が OPEN ではありません ($state)。スキップ。"; exit 0; fi
          if [ "$isDraft" = "true" ];       then echo "ドラフト PR です。スキップ。"; exit 0; fi
          if [ "$baseRef" != "main" ];      then echo "ベースが main ではありません ($baseRef)。スキップ。"; exit 0; fi
          if [ "$mergeable" != "MERGEABLE" ]; then echo "マージ不可 ($mergeable)。スキップ。"; exit 0; fi

          # 4. CI の成功を再確認する。head SHA に対する ci.yml の最新 run が
          #    success であることを要求する (ブランチ保護に依存しないため)。
          ci_conclusion="$(gh api \
            "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$headSha&event=pull_request" \
            --jq '.workflow_runs[0].conclusion // empty')"
          if [ "$ci_conclusion" != "success" ]; then
            echo "最新の CI run が success ではありません ($ci_conclusion)。スキップ。"
            exit 0
          fi

          # 5. Codex のレビューゲート (#1109)。判定方式とその根拠はファイル冒頭の
          #    「Step 5 の判定方式と、そう決めた理由」を参照。要点だけ再掲すると、
          #    現在の head SHA に対する Codex の完了信号 (レビュー提出 or 👍) を
          #    待ち、利用上限に達している場合だけ警告付きで緩和する。
          codex_bypass="$(echo "$meta" | jq -r --arg l "$CODEX_BYPASS_LABEL" \
            '[.labels[].name] | index($l) != null')"

          if [ "$codex_bypass" = "true" ]; then
            # 5-0. 明示的な免除ラベル。Codex 要件だけを飛ばして Step 6 へ進む。
            echo "::warning title=Codex のレビューゲートを免除しました::PR #$PR に '$CODEX_BYPASS_LABEL' ラベルが付いているため、Codex のレビュー要件を免除して自動マージします (未解決レビュースレッドの判定は免除されません)。"
            {
              echo "### :warning: Codex のレビューゲートを免除しました"
              echo ""
              echo "- 対象 PR: #$PR (head \`$headSha\`)"
              echo "- \`$CODEX_BYPASS_LABEL\` ラベルにより **Codex のレビュー要件を免除**しました。"
              echo "- 未解決レビュースレッドの判定 (Step 6) は免除していません。"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # 5-1. head SHA の push 観測時刻。GitHub がサーバ側で観測した時刻として
            #      head SHA に対する check-suite の作成時刻の最小値を使う。
            #      **git の committer date にフォールバックしてはいけない**
            #      (冒頭の設計方針を参照)。取れなければ安全側でスキップする。
            push_observed_at=""
            if ! push_observed_at="$(gh api "repos/$GH_REPO/commits/$headSha/check-suites" \
                 --jq '[.check_suites[].created_at] | sort | .[0] // empty' 2>&1)"; then
              echo "::warning::head commit ($headSha) の check-suites (push 観測時刻の代替) の取得に失敗しました: $push_observed_at"
              push_observed_at=""
            fi
            if [ -z "$push_observed_at" ]; then
              echo "head ($headSha) の push 観測時刻を決定できませんでした。安全側でスキップ。"
              exit 0
            fi
            echo "head ($headSha) の push 観測時刻: $push_observed_at"

            # 5-2. Codex のレビュー提出 (シグナル a-1 / a-2)。
            codex_reviews="$(gh api "repos/$GH_REPO/pulls/$PR/reviews" --paginate --jq '.[]' \
              | jq -s --arg login "$CODEX_LOGIN" '[.[] | select(.user.login == $login)]')"

            codex_reviewed_head="false"
            codex_signal=""

            if [ "$(printf '%s' "$codex_reviews" \
                 | jq -r --arg sha "$headSha" '[.[] | select(.commit_id == $sha)] | length')" -gt 0 ]; then
              codex_reviewed_head="true"
              codex_signal="レビューの commit_id が head と一致"
            fi

            if [ "$codex_reviewed_head" = "false" ]; then
              # レビュー本文の定型行 (例: `**Reviewed commit:** \`94ffecb297\`) から
              # 短縮 SHA を取り出し、head SHA の接頭辞と一致するかを見る。太字
              # マークアップやコロンの有無のゆらぎを許容する。
              reviewed_shas="$(printf '%s' "$codex_reviews" \
                | jq -r '.[] | ((.body // "") | capture("Reviewed commit:?\\**\\s*`?(?<sha>[0-9a-fA-F]{7,40})`?"; "i") | .sha)?' \
                | tr 'A-Z' 'a-z' | sort -u || true)"
              head_lower="$(printf '%s' "$headSha" | tr 'A-Z' 'a-z')"
              for s in $reviewed_shas; do
                case "$head_lower" in
                  "$s"*)
                    codex_reviewed_head="true"
                    codex_signal="レビュー本文の 'Reviewed commit: $s' が head と前方一致"
                    ;;
                esac
              done
            fi

            # 5-3. 指摘ゼロのときの完了信号 (シグナル b): PR 本体への 👍 リアクション。
            #      **リアクションはコミットに紐付かない** (1 ユーザ 1 個) ため、
            #      「どの push に対する 👍 か」は厳密には特定できない。push 観測時刻
            #      以降に付いていることを「この head に対する反応」の代理指標として
            #      扱う。この弱さを committer date で更に弱めないために、5-1 では
            #      サーバ側の観測時刻だけを使っている。
            if [ "$codex_reviewed_head" = "false" ]; then
              codex_thumbs="$(gh api "repos/$GH_REPO/issues/$PR/reactions" --paginate --jq '.[]' \
                | jq -s --arg login "$CODEX_LOGIN" --arg since "$push_observed_at" \
                    '[.[] | select(.user.login == $login and .content == "+1" and .created_at >= $since)] | length')"
              if [ "${codex_thumbs:-0}" -gt 0 ]; then
                codex_reviewed_head="true"
                codex_signal="push 観測時刻以降の 👍 リアクション (指摘なしで完了)"
              fi
            fi

            # 5-4. issue comment 側のシグナル: 利用上限メッセージと、自分が投稿した
            #      `@codex review` 依頼マーカー。
            codex_request_marker="<!-- automerge:codex-review-request:$headSha -->"
            pr_comments="$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq '.[]' | jq -s '.')"
            codex_limit_for_head="$(printf '%s' "$pr_comments" \
              | jq -r --arg login "$CODEX_LOGIN" --arg since "$push_observed_at" \
                  '[.[] | select(.user.login == $login
                                 and ((.body // "") | ascii_downcase | contains("reached your codex usage limits"))
                                 and .created_at >= $since)] | length')"
            codex_limit_any="$(printf '%s' "$pr_comments" \
              | jq -r --arg login "$CODEX_LOGIN" \
                  '[.[] | select(.user.login == $login
                                 and ((.body // "") | ascii_downcase | contains("reached your codex usage limits")))] | length')"
            codex_request_posted="$(printf '%s' "$pr_comments" \
              | jq -r --arg m "$codex_request_marker" '[.[] | select((.body // "") | contains($m))] | length')"

            if [ "$codex_reviewed_head" = "true" ]; then
              echo "Codex のレビュー完了を確認しました (head=$headSha, 根拠: $codex_signal)。"
            elif [ "${codex_limit_for_head:-0}" -gt 0 ]; then
              # 5-5. この head に対して Codex が「利用上限」と返答済み。待っても
              #      レビューは来ないので緩和して通すが、黙っては通さない。
              echo "::warning title=Codex が利用上限でレビューを提出できていません::PR #$PR (head=$headSha) に対し Codex は利用上限メッセージを返しており、レビューが 1 件もないまま自動マージされます。"
              {
                echo "### :warning: Codex が利用上限でレビューを提出できていません"
                echo ""
                echo "- 対象 PR: #$PR (head \`$headSha\`)"
                echo "- Codex は \`You have reached your Codex usage limits for code reviews.\` を返しており、"
                echo "  この head に対する **レビューを 1 件も提出していません**。"
                echo "- 待っても状況が変わらず PR が永久に停止するため、**マージは継続**します (CI は通過済み)。"
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
            else
              # 5-6. head が未レビュー。まずは Codex の自動レビュー (open /
              #      draft → ready で走る) の到着を待ち、それでも来なければ
              #      `@codex review` を 1 回だけ依頼する (Codex は push では
              #      再レビューしないため)。
              now_epoch="$(date -u +%s)"
              observed_epoch="$(date -u -d "$push_observed_at" +%s)"
              elapsed=$(( now_epoch - observed_epoch ))
              delay=$(( CODEX_REREVIEW_DELAY_MINUTES * 60 ))

              if [ "$elapsed" -lt "$delay" ]; then
                echo "Codex は head ($headSha) をまだレビューしていません。自動レビューの到着を待つためスキップ (経過 ${elapsed}s / ${delay}s)。"
                exit 0
              fi

              if [ "${codex_request_posted:-0}" -eq 0 ]; then
                if [ -n "${CODEX_PAT:-}" ]; then
                  # **投稿が成功したときにしかマーカーは残らない** (マーカーは
                  # コメント本文の中にしか存在しない)。マーカーだけ残すと、その
                  # head SHA には二度と依頼が飛ばず永久に停止する。
                  request_body="$(printf '%s\n\n%s\n<sub>automerge (#1109): Codex がこの head SHA をまだレビューしていないため自動的にリクエストしました。</sub>\n' \
                    '@codex review' "$codex_request_marker")"
                  if printf '%s' "$request_body" \
                     | GH_TOKEN="$CODEX_PAT" gh pr comment "$PR" --body-file - >/dev/null; then
                    echo "PR #$PR に @codex review を自動投稿しました (head=$headSha)。応答を待つためスキップ。"
                    exit 0
                  fi
                  echo "::warning::PR #$PR への @codex review の自動投稿に失敗しました (head=$headSha)。"
                else
                  echo "::warning title=CODEX_PAT が未設定のため @codex review を投稿できません::PR #$PR (head=$headSha) は Codex に未レビューですが、Secrets CODEX_PAT が無いため再レビューを依頼できません。GITHUB_TOKEN (github-actions[bot]) 由来のコメントにレビュー bot は反応しないため空打ちはしません。手動で '@codex review' とコメントするか、'$CODEX_BYPASS_LABEL' ラベルでの免除を検討してください。"
                fi
              fi

              if [ "${codex_limit_any:-0}" -gt 0 ]; then
                # 5-7. 依頼を出せない / 出したが応答が無い状態で、この PR では過去に
                #      利用上限メッセージが観測されている。永久停止を避けるため
                #      緩和して通す (警告付き)。
                echo "::warning title=Codex のレビューゲートが素通りしています::PR #$PR (head=$headSha) はこの head に対する Codex のレビューが無いまま自動マージされます (この PR では過去に Codex の利用上限メッセージを観測済みで、待っても状況が変わらないと判断)。"
                {
                  echo "### :warning: Codex のレビューゲートが素通りしています"
                  echo ""
                  echo "- 対象 PR: #$PR (head \`$headSha\`)"
                  echo "- この head に対する Codex のレビューはありません。"
                  echo "- この PR では過去に **Codex の利用上限メッセージ**を観測しており、"
                  echo "  待っても状況が変わらず PR が永久に停止するため **マージは継続**します。"
                  echo "- 再レビューを自動で依頼するには Secrets \`CODEX_PAT\` (人間ユーザの PAT) の登録が必要です。"
                  echo ""
                } >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Codex の head ($headSha) に対するレビューがまだありません。完了を待つためスキップ。"
                echo "  (恒久的に来ない場合は '@codex review' を手動投稿するか、'$CODEX_BYPASS_LABEL' ラベルで免除してください)"
                exit 0
              fi
            fi
          fi

          # 6. 未解決のレビュースレッドが無いことを確認する。投稿者は問わない
          #    (Codex・人間・過去の CodeRabbit の指摘をすべて対象にする)。
          #    スレッドが多すぎる (>100) 場合は取りこぼしを避けるため安全側でスキップする。
          threads_json="$(gh api graphql -f query='
            query($owner:String!, $repo:String!, $pr:Int!) {
              repository(owner:$owner, name:$repo) {
                pullRequest(number:$pr) {
                  reviewThreads(first:100) {
                    totalCount
                    nodes { isResolved }
                  }
                }
              }
            }' -f owner="$owner" -f repo="$repo" -F pr="$PR")"
          total="$(echo "$threads_json" | jq -r '.data.repository.pullRequest.reviewThreads.totalCount')"
          if [ "$total" -gt 100 ]; then
            echo "レビュースレッドが 100 を超えています。安全のためスキップ。"
            exit 0
          fi
          unresolved="$(echo "$threads_json" | jq -r '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')"
          if [ "$unresolved" -gt 0 ]; then
            echo "未解決のレビュースレッドが $unresolved 件あります。スキップ。"
            exit 0
          fi

          # 7. mergeStateStatus を見ながらマージする。GitHub の再計算待ちは
          #    指数バックオフ (5,10,20,40,80 秒) で最大 5 回リトライする。
          delay=5
          merged="false"
          for i in 1 2 3 4 5; do
            mss="$(gh pr view "$PR" --json mergeStateStatus --jq '.mergeStateStatus')"
            echo "mergeStateStatus=$mss (試行 $i/5)"
            case "$mss" in
              CLEAN|UNSTABLE|HAS_HOOKS)
                if gh pr merge "$PR" --merge; then
                  merged="true"
                  break
                fi
                echo "マージ試行が失敗。$delay 秒後に再試行..."
                sleep "$delay"; delay=$((delay * 2)) ;;
              DIRTY)
                echo "コンフリクトあり (DIRTY)。スキップ。"; exit 0 ;;
              BEHIND)
                echo "ベースに遅れています (BEHIND)。スキップ。"; exit 0 ;;
              *)
                # BLOCKED / UNKNOWN など: 再計算待ち。待機して再評価。
                echo "状態が未確定 ($mss)。$delay 秒待機して再評価..."
                sleep "$delay"; delay=$((delay * 2)) ;;
            esac
          done

          if [ "$merged" != "true" ]; then
            echo "マージできませんでした。"
            exit 0
          fi
          echo "PR #$PR をマージしました。"

          # 8. (ベストエフォート) PR 本文のクローズキーワードから Issue を閉じる。
          #    main は既定ブランチなので通常は GitHub が自動クローズするが、
          #    取りこぼし対策の保険として明示的に閉じてコメントを残す。失敗しても
          #    ワークフローは落とさない。
          body="$(gh pr view "$PR" --json body --jq '.body // ""')"
          nums="$(printf '%s' "$body" \
            | grep -oiE '(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved) #[0-9]+' \
            | grep -oE '[0-9]+' | sort -u || true)"
          for n in $nums; do
            is_pr="$(gh api "repos/$GH_REPO/issues/$n" --jq 'has("pull_request")' 2>/dev/null || echo "error")"
            [ "$is_pr" = "error" ] && continue
            [ "$is_pr" = "true" ] && continue   # PR は対象外
            istate="$(gh api "repos/$GH_REPO/issues/$n" --jq '.state' 2>/dev/null || echo "")"
            [ "$istate" != "open" ] && continue
            gh issue close "$n" --reason completed \
              --comment "PR #$PR のマージに伴いクローズしました。" || true
          done
