name: mutation-test

# ミューテーションテスト (#528)
#
# 安全網関数 (is_read_only_sql / apply_auto_limit / has_stacked_statements /
# is_query_shape / with_cte_is_mutation / quote_ident / sql_literal) に変異を
# 注入し、既存テストが変異を捕捉できるかを定量評価する。
#
# 対象はファイル単位ではなく関数単位 (#1168)。対象関数リストの単一ソースは
# src-tauri/.cargo/mutants.toml (examine_globs + examine_re) で、本ワークフローは
# `cargo mutants` / `cargo mutants --list` でそれを読むだけ (本体の実行には
# CI 専用の --in-place だけを付ける。理由は Run cargo-mutants ステップのコメント)。実在する
# 実装は次のとおり (DriverKind は Mysql / Postgres / Sqlite の 3 つ)。
#   db/mod.rs       is_read_only_sql* / apply_auto_limit* / has_stacked_statements*
#   db/mysql.rs     is_query_shape / with_cte_is_mutation / quote_ident
#   db/postgres.rs  is_query_shape
#   db/sqlite.rs    is_query_shape / quote_ident
#   db/sync.rs      quote_ident
#   db/data_diff.rs sql_literal
#   lib.rs          __test_api のディスパッチ (is_query_shape ほか)
# 関数を足す・外すときは mutants.toml だけを直し、`cargo mutants --list` で確認する。
#
# 実行時間が長い (全変異で数十分以上) ため、PR では走らせず手動トリガのみ。
# 可視化 (Job Summary + アーティファクト) だけを目的とし、fail させない方針。
# バンドルサイズ (#443)・カバレッジ (#482) と同じ漸進方針。
on:
  workflow_dispatch:
    inputs:
      list_only:
        description: "変異候補を一覧するだけでテストは走らせない (--list)"
        type: boolean
        default: false

permissions:
  contents: read

# 手動トリガを連続起動したとき、数十分かかるジョブが重複して走らないようにする。
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

jobs:
  mutants:
    name: cargo-mutants (安全網関数 shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # --in-place は 1 ランナーで変異を 1 つずつしか試せない (並列 --jobs と併用不可)。
    # 1 変異 ≒ ビルド 53 秒 + テスト 19 秒で、全 132 件を 1 ジョブで回すと 120 分の
    # 上限を超えて打ち切られた (2026-10-15 JST、#1633)。そこで --shard で 4 ランナーに
    # 分ける (1 シャード 約 30 分)。--shard の k は 0 始まり (0/4〜3/4)。
    # list_only は一覧を出すだけなので 1 ジョブで足りる。
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.list_only && '[0]' || '[0, 1, 2, 3]') }}
    # ハング時にデフォルト 6 時間ランナーを占有し続けるのを防ぐ上限 (正常時は影響なし)。
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ランナーの apt インデックスが古いと、cache-apt-pkgs-action のクリーン
      # インストールが削除済みの .deb を参照して 404 で失敗し、mold が入らないまま
      # 先へ進んでしまう (2026-10-15 JST の初回手動実行で libsoup3 が 404 になり、
      # `-fuse-ld=mold` のリンクで cargo-mutants が全滅した。#1633)。ci.yml と同じく
      # ミラーを本家に差し替えてから apt-get update でリストを最新化する。
      - name: Use canonical apt archive + refresh indexes (stale runner lists cause 404)
        run: |
          printf 'http://archive.ubuntu.com/ubuntu\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update

      # clang + mold はビルド高速化用 (src-tauri/.cargo/config.toml の Linux 設定)。
      # Tauri のシステム依存は tauri-build の build.rs で必要。
      - name: System deps (Tauri 2 prerequisites)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev build-essential curl wget file libssl-dev clang mold
          version: tauri-2-mutants

      # cargo-mutants は rust ジョブと同じ Rust テストスイートを変異下で回すだけで、
      # webview も run() も起動せず実フロント資産を必要としない。
      # tauri::generate_context! が参照する frontendDist (../dist) を満たすには
      # dist/index.html が存在すれば足りるため、pnpm install + build の代わりに最小
      # スタブを 1 枚生成する (#796 / #1169、ci.yml の rust ジョブと同じ方針)。
      - name: Stub frontend dist (for tauri::generate_context!)
        shell: bash
        run: mkdir -p dist && echo "" > dist/index.html

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: mutants

      - name: Install cargo-mutants
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-mutants

      # --list モード: 変異候補を一覧して Job Summary に出力するだけ。
      # workflow_dispatch の list_only=true で選択できる。
      - name: List mutants (--list)
        if: inputs.list_only
        working-directory: src-tauri
        run: |
          echo '### Mutation candidates (安全網関数)' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo mutants --list 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 変異テスト本体: 安全網関数群に限定して実行 (対象は mutants.toml が定める)。
      # --no-shuffle で再現性を確保し、失敗しても CI を落とさない。
      # 終了コードは mutants.out/shard-exit-code に書き、mutants.out/ ごとシャード別の
      # アーティファクトに保存する。集計と Job Summary は後段の summary ジョブが行う。
      # cargo-mutants は 0=全捕捉 / 2=生存変異あり / 3=タイムアウトあり / 4=baseline 失敗
      # など。いずれも本ステップは exit 0 で終える (CI は落とさない)。
      # --in-place: cargo-mutants は既定で src-tauri (cargo ワークスペース) だけを
      # 一時ディレクトリへコピーして変異させる。するとコピー先から ../dist
      # (generate_context! が参照) と ../../../src/__tests__/fixtures/*.json
      # (include_str! の共有ゴールデンベクタ) が見えず、無変異の baseline ビルドが
      # 失敗する (exit 4)。CI のランナーは使い捨てなので、作業ツリーをその場で
      # 変異させて相対パスを保つ。ローカルでは作業中のファイルを書き換えるため、
      # mutants.toml には in_place を書かない。
      - name: Run cargo-mutants
        id: mutants
        if: '!inputs.list_only'
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          set -o pipefail
          cargo mutants \
            --in-place \
            --no-shuffle \
            --shard "${SHARD}/4" \
            2>&1 | tee mutants-output.txt
          code=${PIPESTATUS[0]}
          mkdir -p mutants.out
          echo "$code" > mutants.out/shard-exit-code
          cp mutants-output.txt mutants.out/
          exit 0
        env:
          SHARD: ${{ matrix.shard }}

      - name: Upload mutants.out artifact
        if: '!inputs.list_only && always()'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-out-${{ matrix.shard }}
          path: src-tauri/mutants.out/
          if-no-files-found: ignore
          retention-days: 14

  # 4 シャードの outcomes.json を合算して Job Summary と通知用の値を出す。
  # シャードがタイムアウト等で結果を残せなかった場合は exit_code=missing として
  # 実行失敗扱いにする (一部シャードだけのスコアで「成功」と通知しないため)。
  summary:
    name: 変異テストの集計
    needs: mutants
    if: always() && !inputs.list_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      exit_code: ${{ steps.summary.outputs.exit_code }}
      score: ${{ steps.summary.outputs.score }}
      survived: ${{ steps.summary.outputs.survived }}
    steps:
      # 全シャードが結果を残せなかった場合も集計 (= 実行失敗の通知) まで進める。
      - name: Download shard results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-out-*
          path: shards

      - name: Mutation test summary
        id: summary
        run: |
          echo '### Mutation test results (安全網関数)' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          # シャードの終了コードを 1 つにまとめる。4 シャードすべての結果が揃い、
          # どれも 0 / 2 / 3 のときだけ実行成功で、値は最大値 (2 や 3 を優先)。
          # 欠けたシャード・それ以外のコードがあれば、それを通知に残す。
          exit_code=""
          for k in 0 1 2 3; do
            f="shards/mutants-out-$k/shard-exit-code"
            c=$(cat "$f" 2>/dev/null || echo missing)
            case "$c" in
              0|2|3) case "$exit_code" in ""|0|2|3) [ -z "$exit_code" ] || [ "$c" -gt "$exit_code" ] && exit_code=$c ;; esac ;;
              *) exit_code="shard$k:$c" ;;
            esac
          done
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if ls shards/*/outcomes.json >/dev/null 2>&1; then
            # outcomes.json の summary 実キー (CaughtMutant / MissedMutant / Unviable /
            # Timeout / Success) で集計する。生存変異 (MISSED) を先頭に強調し、
            # fail はさせない (可視化のみ)。
            python3 - << 'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib, collections
          counts = collections.Counter()
          for f in sorted(pathlib.Path("shards").glob("*/outcomes.json")):
              data = json.loads(f.read_text())
              counts.update(o.get("summary") for o in data.get("outcomes", []))
          # baseline (無変異のテスト実行) は summary == "Success" で、変異ではない。
          # 変異の母数は baseline を除いた総数。
          caught = counts.get("CaughtMutant", 0)
          missed = counts.get("MissedMutant", 0)
          unviable = counts.get("Unviable", 0)
          timeout = counts.get("Timeout", 0)
          total = caught + missed + unviable + timeout
          tested = caught + missed
          score = f"{caught / tested * 100:.1f}%" if tested else "n/a"
          # 後続の通知ジョブ (#1395) 用に score= / survived= を step output へ残す。
          out = os.environ.get("GITHUB_OUTPUT")
          if out:
              with open(out, "a") as fh:
                  fh.write(f"score={score}\nsurvived={missed}\n")
          if missed:
              print(f"> :warning: **生存変異 (MISSED): {missed} 件** — テストが捕捉できていない変異があります。アーティファクト `mutants-out-*` の `missed.txt` を確認し、`db::tests` に境界ケースを追記してください。")
          else:
              print("> :white_check_mark: **生存変異 (MISSED): 0 件**")
          print("")
          print(f"変異スコア (caught / (caught + missed)): **{score}**")
          print("")
          print("```")
          print(f"  MISSED   (MissedMutant): {missed}")
          print(f"  caught   (CaughtMutant): {caught}")
          print(f"  unviable (Unviable):     {unviable}")
          print(f"  timeout  (Timeout):      {timeout}")
          print(f"  total mutants:           {total}")
          others = {k: v for k, v in counts.items() if k not in ("CaughtMutant", "MissedMutant", "Unviable", "Timeout", "Success")}
          for k, v in sorted(others.items(), key=lambda kv: str(kv[0])):
              print(f"  other {k}: {v}")
          print("```")
          PYEOF
          else
            echo '変異テスト結果ファイルが見つかりませんでした。' >> "$GITHUB_STEP_SUMMARY"
            for f in shards/*/mutants-output.txt; do
              [ -f "$f" ] || continue
              echo "#### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -50 "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            done
          fi

  # 結果の通知 (#1395)。手動実行の可視化専用で見に行かなければ腐るため、トラッキング
  # Issue (ラベル ci:mutants) に結果を残す。生存変異は毎回「ある」のが普通でノイズに
  # なるので、通知条件は次のとおりに絞る。
  #   - 実行失敗 (結果ファイル無し / baseline 失敗 等) … 必ず upsert
  #   - 生存変異が 1 件以上 … 前回通知と (生存数, スコア) が変わったときだけコメント
  #     追記 (TRACK_DEDUP_KEY で同一結果の連投を抑止)
  #   - 実行成功かつ生存 0 件 … 回復としてクローズ
  # `issues: write` は本ジョブにだけ付与。list_only 実行と既定ブランチ以外の実行では通知しない。
  notify:
    name: 結果の通知 (トラッキング Issue)
    needs: [mutants, summary]
    if: always() && !inputs.list_only && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (needs.mutants.result == 'success' || needs.mutants.result == 'failure') && needs.summary.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/upsert-tracking-issue.sh
          sparse-checkout-cone-mode: false

      - name: トラッキング Issue を upsert
        env:
          GH_TOKEN: ${{ github.token }}
          M_RESULT: ${{ needs.mutants.result }}
          M_EXIT: ${{ needs.summary.outputs.exit_code }}
          M_SCORE: ${{ needs.summary.outputs.score }}
          M_SURVIVED: ${{ needs.summary.outputs.survived }}
          TRACK_LABEL: ci:mutants
          # 生存変異の潰しはテスト追記で 1〜数日。安全網 (読み取り専用ガード) の強化なので恩恵は大きい。
          TRACK_EXTRA_LABELS: cost:Mid,benefit:4
        run: |
          # exit_code は 0 / 2 (生存変異あり) / 3 (タイムアウトあり) が「実行成功」。
          # スコアが取れていない場合 (結果ファイル無し) も実行失敗として扱う。
          run_ok=0
          # スコアが "n/a" (母数 0 = 変異が 1 つも評価されていない) も実行失敗扱いにする。
          case "${M_EXIT:-}" in 0|2|3) [ -n "$M_SCORE" ] && [ "$M_SCORE" != "n/a" ] && run_ok=1 ;; esac
          if [ "$M_RESULT" = "success" ] && [ "$run_ok" = "1" ] && [ "${M_SURVIVED:-0}" = "0" ]; then
            TRACK_STATE=ok bash scripts/upsert-tracking-issue.sh
            exit 0
          fi
          {
            if [ "$run_ok" = "1" ]; then
              echo "cargo-mutants (安全網関数) で生存変異が検出されたため自動作成されたトラッキング Issue です。"
              echo ""
              echo "- 生存変異 (MISSED): **${M_SURVIVED} 件** / 変異スコア: **${M_SCORE}**"
              echo "- 詳細は実行ページの Job Summary と Artifacts (\`mutants-out-*\` の \`missed.txt\`) を確認し、\`db::tests\` に境界ケースを追記してください。"
              key="survived=${M_SURVIVED};score=${M_SCORE}"
            else
              echo "cargo-mutants の実行が失敗した (結果ファイルが得られなかった) ため自動作成されたトラッキング Issue です。"
              echo ""
              echo "- ジョブ結果: \`${M_RESULT}\` / 終了コード: \`${M_EXIT:-不明}\`"
              echo "- 実行ページの Job Summary 末尾 50 行を確認してください。"
              key="failed;exit=${M_EXIT:-unknown}"
            fi
            echo ""
            echo "同一結果の連続実行ではコメントを追記しません。生存 0 件で正常に完了すると自動クローズされます。"
          } > issue-body.md
          TRACK_STATE=problem \
            TRACK_TITLE="[mutants] 安全網関数の変異テストで生存変異 / 実行失敗を検出" \
            TRACK_BODY_FILE=issue-body.md \
            TRACK_DEDUP_KEY="$key" \
            bash scripts/upsert-tracking-issue.sh
