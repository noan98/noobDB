name: mutation-test

# ミューテーションテスト (#528)
#
# 安全網関数 (is_read_only_sql / apply_auto_limit / has_stacked_statements /
# is_query_shape / with_cte_is_mutation / quote_ident / sql_literal) に変異を
# 注入し、既存テストが変異を捕捉できるかを定量評価する。
#
# 対象はファイル単位ではなく関数単位 (#1168)。対象関数リストの単一ソースは
# src-tauri/.cargo/mutants.toml (examine_globs + examine_re) で、本ワークフローは
# フラグ無しの `cargo mutants` / `cargo mutants --list` でそれを読むだけ。実在する
# 実装は次のとおり (DriverKind は Mysql / Postgres / Sqlite の 3 つ)。
#   db/mod.rs       is_read_only_sql* / apply_auto_limit* / has_stacked_statements*
#   db/mysql.rs     is_query_shape / with_cte_is_mutation / quote_ident
#   db/postgres.rs  is_query_shape
#   db/sqlite.rs    is_query_shape / quote_ident
#   db/sync.rs      quote_ident
#   db/data_diff.rs sql_literal
#   lib.rs          __test_api のディスパッチ (is_query_shape ほか)
# 関数を足す・外すときは mutants.toml だけを直し、`cargo mutants --list` で確認する。
#
# 実行時間が長い (全変異で数十分以上) ため、PR では走らせず手動トリガのみ。
# 可視化 (Job Summary + アーティファクト) だけを目的とし、fail させない方針。
# バンドルサイズ (#443)・カバレッジ (#482) と同じ漸進方針。
on:
  workflow_dispatch:
    inputs:
      list_only:
        description: "変異候補を一覧するだけでテストは走らせない (--list)"
        type: boolean
        default: false

permissions:
  contents: read

# 手動トリガを連続起動したとき、数十分かかるジョブが重複して走らないようにする。
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

jobs:
  mutants:
    name: cargo-mutants (安全網関数)
    runs-on: ubuntu-latest
    # フル実行は数十分かかるが、ハング時にデフォルト 6 時間ランナーを占有し続ける
    # のを防ぐため余裕を持った上限を付ける (正常時は影響なし)。
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # clang + mold はビルド高速化用 (src-tauri/.cargo/config.toml の Linux 設定)。
      # Tauri のシステム依存は tauri-build の build.rs で必要。
      - name: System deps (Tauri 2 prerequisites)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev build-essential curl wget file libssl-dev clang mold
          version: tauri-2-mutants

      # cargo-mutants は rust ジョブと同じ Rust テストスイートを変異下で回すだけで、
      # webview も run() も起動せず実フロント資産を必要としない。
      # tauri::generate_context! が参照する frontendDist (../dist) を満たすには
      # dist/index.html が存在すれば足りるため、pnpm install + build の代わりに最小
      # スタブを 1 枚生成する (#796 / #1169、ci.yml の rust ジョブと同じ方針)。
      - name: Stub frontend dist (for tauri::generate_context!)
        shell: bash
        run: mkdir -p dist && echo "" > dist/index.html

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: mutants

      - name: Install cargo-mutants
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-mutants

      # --list モード: 変異候補を一覧して Job Summary に出力するだけ。
      # workflow_dispatch の list_only=true で選択できる。
      - name: List mutants (--list)
        if: inputs.list_only
        working-directory: src-tauri
        run: |
          echo '### Mutation candidates (安全網関数)' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo mutants --list 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 変異テスト本体: 安全網関数群に限定して実行 (対象は mutants.toml が定める)。
      # --no-shuffle で再現性を確保し、失敗しても CI を落とさない (|| true)。
      # mutants.out/ をアーティファクトとして保存し、Job Summary にサマリを出す。
      - name: Run cargo-mutants
        if: '!inputs.list_only'
        working-directory: src-tauri
        run: |
          cargo mutants \
            --no-shuffle \
            2>&1 | tee mutants-output.txt || true

      - name: Mutation test summary
        if: '!inputs.list_only'
        working-directory: src-tauri
        run: |
          echo '### Mutation test results (安全網関数)' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ -f mutants.out/outcomes.json ]; then
            # outcomes.json の summary 実キー (CaughtMutant / MissedMutant / Unviable /
            # Timeout / Success) で集計する。生存変異 (MISSED) を先頭に強調し、
            # fail はさせない (可視化のみ)。
            python3 - << 'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib, collections
          data = json.loads(pathlib.Path("mutants.out/outcomes.json").read_text())
          counts = collections.Counter(o.get("summary") for o in data.get("outcomes", []))
          # baseline (無変異のテスト実行) は summary == "Success" で、変異ではない。
          # 変異の母数は baseline を除いた総数。
          caught = counts.get("CaughtMutant", 0)
          missed = counts.get("MissedMutant", 0)
          unviable = counts.get("Unviable", 0)
          timeout = counts.get("Timeout", 0)
          total = caught + missed + unviable + timeout
          tested = caught + missed
          score = f"{caught / tested * 100:.1f}%" if tested else "n/a"
          if missed:
              print(f"> :warning: **生存変異 (MISSED): {missed} 件** — テストが捕捉できていない変異があります。`mutants.out/missed.txt` を確認し、`db::tests` に境界ケースを追記してください。")
          else:
              print("> :white_check_mark: **生存変異 (MISSED): 0 件**")
          print("")
          print(f"変異スコア (caught / (caught + missed)): **{score}**")
          print("")
          print("```")
          print(f"  MISSED   (MissedMutant): {missed}")
          print(f"  caught   (CaughtMutant): {caught}")
          print(f"  unviable (Unviable):     {unviable}")
          print(f"  timeout  (Timeout):      {timeout}")
          print(f"  total mutants:           {total}")
          others = {k: v for k, v in counts.items() if k not in ("CaughtMutant", "MissedMutant", "Unviable", "Timeout", "Success")}
          for k, v in sorted(others.items(), key=lambda kv: str(kv[0])):
              print(f"  other {k}: {v}")
          print("```")
          PYEOF
          else
            echo '変異テスト結果ファイルが見つかりませんでした。' >> "$GITHUB_STEP_SUMMARY"
            if [ -f mutants-output.txt ]; then
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -50 mutants-output.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload mutants.out artifact
        if: '!inputs.list_only && always()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-out
          path: src-tauri/mutants.out/
          if-no-files-found: ignore
          retention-days: 14
