# cargo-nextest の設定 (CI の `rust (test)` / `rust (coverage)` / `rust (windows test)` が使う)。
#
# nextest は**テストごとにプロセスを分けて**並列実行する。これは各テストを
# 隔離できる利点がある一方、「プロセス内の Mutex による直列化」がまったく効か
# ないことを意味する — `cargo test` (単一プロセス + スレッド並列) では守れて
# いた不変条件が、nextest では破れる。
#
# `sandbox_integration` の各テストは実際のユーザデータディレクトリにある
# `sandboxes.json` を共有する。ストア側 (`sandboxes/store.rs`) は
# `load_all` → 変更 → `save_all` をプロセス内 Mutex で直列化しているが、
# プロセスを跨ぐ並列実行ではそれが効かず、互いのレコードを上書きし合って
# `sandbox '<id>' not found` で落ちる。テスト同士の衝突なので、このバイナリの
# テストは 1 本ずつ走らせる (プロダクションコードは「1 プロセス = 1 アプリ
# インスタンス」前提のままでよい)。
#
# `commands::dump::tests` も同じ理由で直列化する。
# `cleanup_stale_dump_credential_files` は OS 標準の一時ディレクトリを走査して
# `noobdb-dump-*.cnf` / `.pgpass` を消す (これは本番の意図した挙動) ため、その
# テストと、実物の資格情報ファイルを作って `Drop` での削除を確かめる
# `defaults_file_is_removed_on_drop` / `pgpass_file_is_removed_on_drop` が
# 同時に走ると、前者が後者のファイルを消してしまう。モジュール内の
# `CRED_FILE_TEST_LOCK` が `cargo test` (スレッド並列) では防いでいるが、
# nextest のプロセス並列には効かないので、ここでも 1 本ずつに落とす。
#
# 20 秒を超えたテストを実行中に `SLOW` と出し (遅いテストをログで見つけて次の短縮の
# 根拠にする)、15 回分 (= 300 秒 = 5 分) 経っても終わらないテストは強制終了して
# 失敗扱いにする (#1635)。SSH / TLS 接続待ちなどでハングしたテストが、ジョブの
# timeout-minutes (45 分) まで runner を占有するのを防ぐ。
# 閾値の根拠: 直近の CI ログで観測した最長テストは約 40 秒 (Windows の SQLite の
# 450 行シード。複数行 VALUES の 1 文にして解消済み)。カバレッジ計装
# (`cargo llvm-cov nextest`) 下でも全体 40 秒前後で、300 秒には 1 桁以上の余裕がある。
# 正当に 300 秒を超えるテストが現れたら、下の overrides で個別に延ばす。
[profile.default]
slow-timeout = { period = "20s", terminate-after = 15 }

[test-groups]
sandbox-store = { max-threads = 1 }
dump-temp-files = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/^sandbox_integration::/)'
test-group = 'sandbox-store'

[[profile.default.overrides]]
filter = 'test(commands::dump::tests::)'
test-group = 'dump-temp-files'
