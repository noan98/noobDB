# cargo-deny の設定。CI (`.github/workflows/ci.yml` の `rust (deny)` ジョブ) が
# `cargo deny --manifest-path src-tauri/Cargo.toml check` で実行します。
#
# 目的:
#   - 既知のセキュリティ脆弱性 (RustSec Advisory DB) を PR 段階で検出する。
#   - 依存ライセンスを許可リストで明示し、想定外のライセンスの混入を防ぐ。
#
# DB 接続・SSH 認証・システムキーリングという機密性の高い処理を担うクレート
# (tokio / russh / sqlx / keyring など) を抱えるバックエンドの依存健全性を
# 自動監視するのが狙いです。

# cargo-deny 0.16 以降の設定スキーマを使う。
[graph]
# ターゲット非依存の依存も含め全体を検査対象にする (既定)。

[advisories]
# RustSec Advisory DB に対する脆弱性チェック。脆弱性 / unsound / unmaintained は
# cargo-deny 0.16+ では既定で error になる。
yanked = "deny"
# unmaintained は「自分が直接依存しているクレート」に限定して検出する。Tauri の
# Linux GUI スタック (gtk/gdk/atk/gdkx11 …) や unic-*・proc-macro-error といった
# 深い推移依存の unmaintained は upstream の管轄で本リポジトリでは差し替えられない
# ため、transitive を対象から外す。直接依存に unmaintained を足したときは検出する。
unmaintained = "workspace"
# 個別に握りつぶす項目。いずれも russh / Tauri の推移依存で、本リポジトリの
# Cargo.toml では制御できず、現時点で修正版が存在しない既知事項。新しい依存で
# 新たな脆弱性が混入した場合はここに無いので CI で検出される。
ignore = [
    # rsa の Marvin 攻撃 (タイミング側チャネル)。SSH 認証用に russh が引き込む
    # rsa 0.10.0-rc.16 に該当。修正版は未リリースで、russh 側の対応待ち。
    "RUSTSEC-2023-0071",
    # russh が固定する aes 0.9.0 (プレリリース系暗号スタック) は crates.io で
    # yank 済み。差し替えは russh の更新待ち。
    { crate = "aes@0.9.0", reason = "russh 0.60 が固定する yanked なプレリリース版。upstream 更新待ち" },
    # quick-xml 0.39.4 の 2 件の DoS advisory (RUSTSEC-2026-0194: 重複属性名検査の
    # 二次関数的実行時間 / RUSTSEC-2026-0195: NsReader の非有界アロケーション)。
    # Tauri (tauri → plist 1.9.0) が 0.39 系を固定しており、plist/tauri 側が
    # quick-xml >= 0.41 に更新するまで cargo update では差し替えられない (0.41 は
    # plist の依存制約外)。本アプリは信頼できない XML を quick-xml の NsReader で
    # 解析せず、plist は Tauri 内部の macOS メタデータ処理でのみ使われるため実影響は
    # 低い。plist/Tauri の更新で解消次第、この 2 件を外す。
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # #729 (MSSQL ドライバ、tiberius) が引き込む rustls-webpki 0.101.7 の 3 件。
    # 依存経路: tiberius 0.12.3 → tokio-rustls 0.24.1 → rustls 0.21.12 →
    # rustls-webpki 0.101.7。修正版は rustls-webpki >= 0.103.12 (rustls 0.22+
    # が要る) だが、crates.io の tiberius 最新 (0.12.3、2025 年時点) は
    # rustls 0.21 系に固定されており、`cargo update` では引き上げられない
    # (tiberius 側が rustls 0.22+ に上げるまで解消不能)。
    { id = "RUSTSEC-2026-0098", reason = "tiberius(#729) → tokio-rustls 0.24 → rustls 0.21 → rustls-webpki 0.101 に固定。URI 名の name constraints 誤受理だが、そもそも信頼済み CA が誤った証明書を発行した場合にのみ到達する経路 (署名検証を通過した後のホスト名照合ロジックの話であり、リモート攻撃者が単独で悪用できるものではない)。tiberius が rustls 0.22+ に追従次第、この ignore を削除する。" },
    { id = "RUSTSEC-2026-0099", reason = "同上の依存経路。ワイルドカード名に対する name constraints の誤受理も同様に、信頼済み CA の誤発行を前提とする限定的なリスク。tiberius の rustls 0.22+ 追従待ち。" },
    { id = "RUSTSEC-2026-0104", reason = "同上の依存経路。CRL パースで到達可能な panic だが、本アプリは tiberius 経由で CRL 検証 API を一切呼び出さない (TLS ハンドシェイクの証明書検証パスのみ使用) ため実行時に到達しない。tiberius の rustls 0.22+ 追従待ち。" },
]

[licenses]
# 許可するライセンス (SPDX 識別子)。現在の依存ツリーに実在するもののうち、
# 単独で要求される / AND 式で要求されるものを網羅している。OR 式
# (例: "MIT OR Apache-2.0") はいずれかが許可されていれば充足する。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    # DuckDB (#709) の依存ツリー (duckdb → arrow-array/arrow-select →
    # ahash → const-random → tiny-keccak) が引き込む。パブリックドメイン
    # 相当の最大限に寛容なライセンス。
    "CC0-1.0",
]
# ライセンス判定の信頼度しきい値。1.0 に近いほど厳密。
confidence-threshold = 0.8
# 自クレート (noobdb 本体) は publish = false の非公開アプリなので検査から除外する。
private = { ignore = true }

[bans]
# 同一クレートの複数バージョン同居は警告に留める (Tauri/sqlx の巨大依存ツリーでは
# 推移依存のバージョン重複は避けにくいため、fail させず可視化のみ)。
multiple-versions = "warn"
wildcards = "allow"

[sources]
# crates.io 以外の未知レジストリ / 未知 git ソースからの取得を拒否する。
unknown-registry = "deny"
unknown-git = "deny"
